<style>
/* Layout: mobile-first course reader. Fixed bottom tab bar (Cours, Cartes, Quiz, Recherche, Progrès); content in one column, max 720px. Palette: cool paper, petrol green accent, marker-yellow highlight for German. */
*{box-sizing:border-box}
html,body{margin:0}
html{font-size:var(--root,100%)}
body{color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:var(--lh,1.5);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30}
#app{max-width:720px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;min-height:56px}
.top h1{font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;padding:0 12px}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hero{padding:18px 0 8px}
.hero .kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.hero h1 span{background:linear-gradient(transparent 60%,var(--mark) 60%)}
.cont{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:14px 0;padding:14px 16px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink)}
.cont small{display:block;opacity:.85;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.cont b{font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.cont .arrow{margin-left:auto;font-size:1.4rem}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin:10px 0 4px}.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:42px;font-weight:600;color:var(--muted)}.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;min-width:0}
.row .n{flex:none;min-width:34px;padding:0 6px;box-sizing:border-box;position:relative;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}

.goalc .bar{margin:8px 0 4px}.lnum{color:var(--accent,#c0392b)}
.bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.chev{color:var(--muted);flex:none}
.setc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;flex-direction:column;gap:8px}.crow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.crow a{color:var(--accent);font-weight:600;overflow-wrap:anywhere;min-width:0}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between}.crow span{min-width:0;overflow-wrap:anywhere;user-select:all}a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.setc small{color:var(--muted)}.setc .seg{margin:0}.setc .seg button{font-size:.88rem;padding:4px 6px;line-height:1.15}.setc input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}.fsrow{display:flex;justify-content:space-between;color:var(--muted)}.demo{margin:0;padding:10px;border-radius:10px;background:var(--surface2)}textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;min-width:0;resize:vertical}
.sec{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px}

.lesson{padding-bottom:12px}

.lesson li.num::before{content:attr(data-n);min-width:1.4em;font-family:var(--f-display);font-weight:700}
.kv{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.kv b{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.ex{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px 8px 12px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}
.ex .tx{flex:1;min-width:0}
.de{font-weight:700;color:var(--de)}.frc{color:var(--frc)}.de2{color:var(--de);font-weight:600}
.ex .fr{display:block;color:var(--frc);font-size:.92rem}
.hidefr .fr{display:none}.hidefr.show .fr{display:block}.hidefr .tx::after{content:"Touchez pour voir la traduction";display:block;font-size:.78rem;color:var(--muted)}.hidefr.show .tx::after{display:none}
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:1rem}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;min-width:78px}
th{background:var(--surface2);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.de{cursor:pointer}td.de::after{content:"";}.legend{display:flex;gap:14px;font-size:.85rem;margin:6px 0 0}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:currentColor}
.fcard .big.de{font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.wide{flex:1}
.pager{display:flex;gap:8px;margin:20px 0}
.pager .btn{flex:1;text-align:left;font-weight:600;line-height:1.2;min-width:0}
.pager small{display:block;color:var(--muted);font-weight:400}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);border-radius:10px;min-height:48px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
/* cards */
.scope{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;min-width:0;max-width:100%}
select{flex:1}
.fc{perspective:900px;margin:10px 0}
.fcard{min-height:240px;width:100%;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 6px 24px -14px rgba(0,0,0,.35)}
.fcard .side{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fcard .big{font-family:var(--f-display);font-size:1.7rem;line-height:1.25;overflow-wrap:anywhere}
.fcard.back{background:var(--accent-soft)}
.prog{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
/* quiz */
.q{margin:8px 0}
.q .qt{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.q .qq{font-family:var(--f-display);font-size:1.4rem;line-height:1.25;margin:6px 0 4px;overflow-wrap:anywhere}
.q .hint{color:var(--muted);font-style:italic;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:48px;line-height:1.3}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.score{text-align:center;padding:22px 10px}
.score b{display:block;font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.fnd{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px;box-shadow:0 0 0 2px var(--mark)}.fnd.cur{outline:3px solid var(--accent);outline-offset:1px;animation:fpulse 1s ease 2}@keyframes fpulse{50%{box-shadow:0 0 0 7px rgba(255,200,0,.5)}}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.snip{color:var(--muted);font-size:.9rem;margin-top:2px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw;font-size:.9rem}
.spin{padding:40px;text-align:center;color:var(--muted)}
.pbar{display:flex;flex-direction:column;gap:12px}
.pbar .l{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.pbar .l span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
@media (prefers-reduced-motion:no-preference){.fcard{transition:transform .2s}.fcard:active{transform:scale(.985)}}
/* ===== Palette "verre" : bleu nuit, turquoise, violet (modèle de la capture) ===== */
:root{
  --bg:#0a1222; --solid:#14233f; --surface:rgba(255,255,255,.07); --surface2:rgba(255,255,255,.11); --ink:#EAF0FA; --muted:#9FB1CC; --line:rgba(255,255,255,.14);
  --de:#8CC0FF; --frc:#6EE0B2; --accent:#4A90E2; --accent-ink:#FFFFFF; --accent-soft:rgba(74,144,226,.20); --mark:#F2B705; --mark-ink:#1B1400;
  --good:#22A27A; --good-soft:rgba(34,162,122,.22); --bad:#E5645A; --bad-soft:rgba(229,100,90,.22);
  --gold:#F2B705; --glass-blur:blur(14px);
  --bgimg:radial-gradient(120% 55% at 0% 0%,#1b3d78 0%,rgba(23,50,97,0) 62%),radial-gradient(90% 45% at 100% 42%,#0d4656 0%,rgba(12,61,77,0) 70%),radial-gradient(120% 55% at 0% 100%,#2d2860 0%,rgba(39,35,81,0) 66%),linear-gradient(180deg,#0a1222,#0a1222);
  --f-display:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif; --f-body:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EAF1FB; --solid:#FFFFFF; --surface:rgba(255,255,255,.72); --surface2:rgba(20,50,100,.08); --ink:#12213A; --muted:#566985; --line:rgba(20,50,100,.15);
  --de:#1D5FC4; --frc:#0F7F57; --accent:#2F7BD6; --accent-ink:#FFFFFF; --accent-soft:rgba(47,123,214,.14); --mark:#FFD866; --mark-ink:#3B2D00;
  --good:#1D7A45; --good-soft:rgba(29,122,69,.16); --bad:#B13A30; --bad-soft:rgba(177,58,48,.14); --gold:#C58F00;
  --bgimg:radial-gradient(120% 55% at 0% 0%,#cfe0fb 0%,rgba(207,224,251,0) 62%),radial-gradient(90% 45% at 100% 42%,#cdeef0 0%,rgba(205,238,240,0) 70%),radial-gradient(120% 55% at 0% 100%,#e0dcfa 0%,rgba(224,220,250,0) 66%),linear-gradient(180deg,#eef3fb,#eef3fb);
  color-scheme:light;
}
html{background:var(--bg)}
body{background:transparent;padding-block:0 104px}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg)}
body::before{background:transparent;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
option{background:var(--solid);color:var(--ink)}
.top{background:rgba(10,18,34,.55);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .top{background:rgba(234,241,251,.7)}
.iconbtn,.btn,.row,.stat,.setc,.tbl,.fcard,.opt,select,input[type=search],textarea,.ex{backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.row,.stat,.setc,.tbl{border-radius:20px;box-shadow:0 8px 24px -16px rgba(0,0,0,.5)}
.row{padding:14px 16px}
.row .n{border-radius:12px;background:var(--surface2)}
.hero h1 span{background:linear-gradient(transparent 62%,rgba(242,183,5,.45) 62%)}

.legend,.crumb{color:var(--muted)}
/* barre du bas : pilule flottante en verre */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:30px;padding:6px;background:rgba(18,30,56,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 34px -14px rgba(0,0,0,.8);max-width:720px;margin:0 auto}
:root[data-theme="light"] nav.tabs{background:rgba(255,255,255,.8)}

.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#EAF0FA;color:#0a1222}

/* en-tête en pilule (accueil) */
.pill{display:flex;align-items:center;gap:10px;margin:calc(12px + env(safe-area-inset-top,0px)) 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:28px;background:var(--surface);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}

.vrow b{font-size:1.1rem}.vrow .frc{display:block}.vrow small{display:block;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

<script>
(function(){
'use strict';
/* ---------- storage ---------- */
var KEY='de0b2:v1';
var S={done:{},cards:{},quiz:{},last:null,days:{},dir:'de',mode:'c',set:{},vfav:{},vseen:{},vrecent:[],vview:'t',hist:[],hard:{},act:{},err:{},sim:[],plan:null,vtr:{},exams:[],level:null,pstat:{}};
var DEF={theme:'dark',fs:100,lh:1.5,rate:.9,hide:false,newc:20,qn:10,genre:true,resume:true,remind:false,rtime:'19:00',goal:20};
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) S[k]=o[k];}}catch(e){}
var BKEYS=['done','cards','quiz','days','last','set','vfav','vseen','vrecent','vview','hist','hard','plan','vtr','exams','level','pstat','act','err','sim'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function G(k){var v=S.set&&S.set[k];return v===undefined?DEF[k]:v;}
function applySettings(){
  var r=document.documentElement,t=G('theme');
  if(t==='auto'){try{t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){t='dark';}}
  r.setAttribute('data-theme',t);
  r.style.setProperty('--root',G('fs')+'%');r.style.setProperty('--lh',G('lh'));
}
function p2(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function today(){return ymd(new Date());}
function touchDay(){S.days[today()]=1;save();}
function streak(){var n=0,d=new Date();for(;;){var k=ymd(d);if(S.days[k]){n++;d.setDate(d.getDate()-1);}else if(n===0&&k===today()){d.setDate(d.getDate()-1);}else break;}return n;}

/* ---------- data ---------- */
var META=[],CATS={},LES={},LESMETA={},ORDER=[],ORD={c:[],d:[],t:[]};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fold(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json();});}
function loadMeta(){
  return getJSON('data/meta.json').then(function(m){
    META=m;
    m.forEach(function(c){c.lessons.forEach(function(l){l.cat=c.id;l.catname=c.name;l.k=c.k;LESMETA[l.id]=l;ORDER.push(l.id);ORD[c.k].push(l.id);});});
  });
}
var loading={};
function loadCat(id){
  if(CATS[id])return Promise.resolve();
  if(loading[id])return loading[id];
  loading[id]=getJSON('data/c'+(id<10?'0':'')+id+'.json').then(function(d){CATS[id]=1;for(var k in d){LES[k]=d[k];d[k].c.forEach(function(c){c.l=k;});}});
  return loading[id];
}
function loadAll(){return Promise.all(META.map(function(c){return loadCat(c.id);}));}

/* ---------- speech ---------- */
var voice=null;
function pickVoice(){try{var vs=speechSynthesis.getVoices();voice=vs.filter(function(v){return /^de/i.test(v.lang);})[0]||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(t){
  try{
    if(!('speechSynthesis' in window))throw 0;
    pickVoice();
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t).replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\//g,', '));
    u.lang='de-DE';u.rate=G('rate');if(voice)u.voice=voice;
    speechSynthesis.speak(u);
    if(!voice)toast('Aucune voix allemande détectée : installez-en une dans les réglages du téléphone.');
  }catch(e){toast('La lecture audio n’est pas disponible sur cet appareil.');}
}
var tt;function toast(m){var b=document.getElementById('toastbox');b.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(function(){b.innerHTML='';},3200);}

/* ---------- state / routing : pile d’écrans, touche retour, reprise ---------- */
var V={name:'home'};
var HS=[],hi=-1,T='home',TS={},RKEY='de0b2:resume',PENDY=0,guardOn=false,ignorePop=false,stickT=null;
function snapV(){try{return JSON.parse(JSON.stringify(V));}catch(e){return {name:'home'};}}
function saveCur(){if(hi>=0)HS[hi]={v:snapV(),sy:Math.round(window.scrollY||0)};}
function stickScroll(y){
  clearTimeout(stickT);var n=0,stop=false;
  function cancel(){stop=true;}
  ['touchstart','wheel','keydown','mousedown'].forEach(function(ev){window.addEventListener(ev,cancel,{passive:true,once:true});});
  (function t(){if(stop)return;window.scrollTo(0,y);if(Math.abs((window.scrollY||0)-y)>3&&n++<35)stickT=setTimeout(t,70);})();
}
function syncGuard(){
  var need=hi>0||T!=='home';
  try{
    if(need&&!guardOn){history.pushState({g:1},'');guardOn=true;}
    else if(!need&&guardOn){ignorePop=true;guardOn=false;history.back();}
  }catch(e){}
}
function go(v,opt){
  opt=opt||{};saveCur();
  if(opt.replace&&hi>=0)HS[hi]={v:v,sy:0};
  else{HS=HS.slice(0,hi+1);HS.push({v:v,sy:0});hi++;if(HS.length>60){HS.shift();hi--;}}
  V=v;render();window.scrollTo(0,0);syncGuard();persist();
}
function back(){
  if(hi>0){saveCur();hi--;V=HS[hi].v;PENDY=HS[hi].sy||0;render();syncGuard();persist();return true;}
  if(T!=='home'){tab('home');return true;}
  return false;
}
function tab(n){
  saveCur();
  if(n===T){HS=[{v:{name:n},sy:0}];hi=0;V=HS[0].v;PENDY=0;render();window.scrollTo(0,0);syncGuard();persist();return;}
  TS[T]={HS:HS,hi:hi};T=n;
  var st=TS[n];
  if(st&&st.HS&&st.HS.length){HS=st.HS;hi=st.hi;V=HS[hi].v;PENDY=HS[hi].sy||0;}
  else{HS=[{v:{name:n},sy:0}];hi=0;V=HS[0].v;PENDY=0;}
  render();if(!PENDY)window.scrollTo(0,0);syncGuard();persist();
}
window.addEventListener('popstate',function(){
  if(ignorePop){ignorePop=false;return;}
  guardOn=false;
  if(!back()){toast('Appuyez encore sur Retour pour quitter');}
});
var persistT=null;
function persist(now){
  clearTimeout(persistT);
  var f=function(){
    try{
      saveCur();
      var r={HS:HS,hi:hi,T:T,TS:TS,t:Date.now()};
      if(FC&&FC.started&&FC.queue&&FC.queue.length)r.FC={scope:FC.scope,queue:FC.queue.map(function(c){return {c:c.slice(),l:c.l};}),i:FC.i,flip:FC.flip,total:FC.total,known:FC.known};
      if(Q&&Q.running)r.Q={scope:Q.scope,qs:Q.qs,i:Q.i,score:Q.score,answered:Q.answered,opts:Q.opts};
      if(typeof persistExtra==='function')persistExtra(r);
      localStorage.setItem(RKEY,JSON.stringify(r));
    }catch(e){}
  };
  if(now)f();else persistT=setTimeout(f,350);
}
window.addEventListener('scroll',function(){persist();},{passive:true});
document.addEventListener('visibilitychange',function(){if(document.hidden)persist(true);});
window.addEventListener('pagehide',function(){persist(true);});

var ICONS={
  home:'<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',

  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  prog:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',

};

/* ---------- helpers ---------- */

function blocks(bs){

function poolFor(scope){

function srs(s,g){
  s=s||{b:0,d:0};
  var e=s.e||2.5,b=s.b||0,n=s.n!==undefined?s.n:b,l=s.l||0,iv=s.iv!==undefined?s.iv:INT[Math.min(b,6)],due;
  if(g===0){e=Math.max(1.3,e-.2);l++;b=0;n=0;iv=0;due=Date.now()+6e5;}
  else{
    if(g===1){e=Math.max(1.3,e-.15);iv=Math.max(1,Math.round(Math.max(iv,1)*1.2));}
    else if(g===2){iv=n===0?1:n===1?3:Math.max(iv+1,Math.round(iv*e));b=Math.min(6,b+1);}
    else{e=e+.15;iv=n===0?4:Math.max(iv+2,Math.round(Math.max(iv,1)*e*1.3));b=Math.min(6,b+2);}
    n++;due=Date.now()+iv*864e5;
  }
  return {b:b,d:due,e:Math.round(e*100)/100,iv:iv,n:n,l:l};
}
function ivLabel(s,g){if(g===0)return '10 min';var d=srs(s,g).iv;return d<30?d+' j':d<365?Math.round(d/30)+' mois':'1 an';}
function grade(g){
  var c=FC.queue[FC.i],k=ckey(c[0]);
  var r=srs(S.cards[k],g);S.cards[k]=r;
  if(g>=2)FC.known++;
  if(g===0)FC.queue.push(c);
  act();touchDay();FC.i++;FC.flip=false;save();drawCards(false);persist();
}

/* ---------- retrouver le mot cherché dans la leçon ---------- */
var FND={els:[],i:0};
function clearFind(){var b=document.getElementById('fbar');if(b)b.remove();document.querySelectorAll('mark.fnd').forEach(function(m){var t=document.createTextNode(m.textContent);m.parentNode.replaceChild(t,m);});FND.els=[];}
function markIn(root,terms){
  var done=[];
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentNode.closest('button,script,style,mark.fnd')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  var nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){
    var txt=n.nodeValue,f=fold(txt),ranges=[];
    terms.forEach(function(t){var p=0,i;while((i=f.indexOf(t,p))>=0){ranges.push([i,i+t.length]);p=i+t.length;}});
    if(!ranges.length)return;
    ranges.sort(function(a,b){return a[0]-b[0];});
    var m=[ranges[0]];for(var k=1;k<ranges.length;k++){var l=m[m.length-1];if(ranges[k][0]<=l[1])l[1]=Math.max(l[1],ranges[k][1]);else m.push(ranges[k]);}
    var frag=document.createDocumentFragment(),pos=0;
    m.forEach(function(r){if(r[0]>pos)frag.appendChild(document.createTextNode(txt.slice(pos,r[0])));var mk=document.createElement('mark');mk.className='fnd';mk.textContent=txt.slice(r[0],r[1]);frag.appendChild(mk);done.push(mk);pos=r[1];});
    if(pos<txt.length)frag.appendChild(document.createTextNode(txt.slice(pos)));
    n.parentNode.replaceChild(frag,n);
  });
  return done;
}
function findInLesson(q){
  clearFind();
  var art=document.querySelector('article.lesson');if(!art||!q)return;
  var body=art.querySelectorAll('h2,h3,p,ul,.kv,.ex,table,.tblw');
  var f=fold(q).trim(),noart=f.replace(/^(der|die|das|ein|eine|to|se|sich) /,'');
  var tries=[[f],[noart],fold(q).split(/\s+/).filter(function(t){return t.length>2;})];
  var els=[];
  for(var a=0;a<tries.length&&!els.length;a++){if(!tries[a].length||(a===1&&noart===f))continue;
    // essaie d'abord avec tout le texte, sinon mot par mot
    els=markIn(art,tries[a]);
    if(els.length&&a===2){/* plusieurs mots : ok */}
  }
  var bar=document.createElement('div');bar.id='fbar';
  bar.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;max-width:704px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:.9rem';
  if(!els.length){
    bar.innerHTML='<span style="flex:1">« '+esc(q)+' » : pas retrouvé dans le texte de cette fiche (il peut se trouver dans les cartes).</span><button class="iconbtn" data-fclose aria-label="Fermer">&times;</button>';
    document.body.appendChild(bar);return;
  }
  FND.els=els;FND.i=0;
  bar.innerHTML='<span style="flex:1;min-width:0"><b id="fcnt"></b> · « '+esc(q)+' »</span><button class="iconbtn" data-fprev aria-label="Précédent">&uarr;</button><button class="iconbtn" data-fnext aria-label="Suivant">&darr;</button><button class="iconbtn" data-fclose aria-label="Fermer">&times;</button>';
  document.body.appendChild(bar);
  showFind(0);
}
function showFind(i){
  var n=FND.els.length;if(!n)return;FND.i=(i+n)%n;

var SIX=null,SQ='',DICT=null;
function buildIndex(){
  SIX=ORDER.map(function(id){
    var m=LESMETA[id],L=LES[id],t=[];
    L.b.forEach(function(b){
      if(b.t==='tbl')b.rows.forEach(function(r){t.push(plain(r.join(' · ')));});
      else if(b.t==='ex')t.push(b.de+' — '+b.fr);
      else if(b.t==='kv')t.push(b.k+' : '+plain(b.x));
      else t.push(plain(b.x));
    });
    return{id:id,title:m.title,ft:fold(m.title),lines:t,fl:t.map(fold)};
  });
}
function vSearch(){
  var h='<div class="top"><h1>Recherche</h1></div><div class="scope"><input type="search" id="q" placeholder="Mot, règle, titre…" value="'+esc(SQ)+'" autocomplete="off" aria-label="Rechercher dans tout le cours" style="flex:1"></div><div id="res"></div>';
  app.innerHTML=h;

  if(!SIX){res.innerHTML='<div class="spin">Chargement du cours, du dictionnaire et des verbes…</div>';Promise.all([loadAll(),loadVerbs(),getJSON('data/dict.json').then(function(d){DICT=d.map(function(w){return{de:w[0],fr:w[1],l:w[2],fd:fold(w[0]),ff:fold(w[1])};});})]).then(function(){buildIndex();if(V.name==='search')doSearch();}).catch(function(){res.innerHTML='<div class="empty">Impossible de charger les données. Vérifiez la connexion.</div>';});}
  else doSearch();

function hl(s,toks){
  var out='',f=fold(s),mark=new Array(s.length).fill(false);
  toks.forEach(function(t){var p=0,i;while((i=f.indexOf(t,p))>=0){for(var k=i;k<i+t.length&&k<s.length;k++)mark[k]=true;p=i+t.length;}});
  var open=false;
  for(var k=0;k<s.length;k++){if(mark[k]&&!open){out+='<span class="hl">';open=true;}if(!mark[k]&&open){out+='</span>';open=false;}out+=esc(s[k]);}
  if(open)out+='</span>';return out;
}
function doSearch(){
  var res=document.getElementById('res');if(!res||!SIX)return;
  var toks=fold(SQ).split(/\s+/).filter(function(t){return t.length>0;});
  if(!toks.length){res.innerHTML='<div class="empty">Tapez un mot allemand ou français pour le retrouver dans le cours, le dictionnaire et les verbes.</div>';return;}
  var wh=[];
  if(DICT){
    var q=toks.join(' ');
    DICT.forEach(function(w){var sc=-1;
      if(w.fd===q||w.fd.replace(/^(der|die|das) /,'')===q)sc=0;
      else if(w.ff===q)sc=1;
      else if(toks.every(function(t){return w.fd.indexOf(t)>=0;}))sc=2;
      else if(toks.every(function(t){return w.ff.indexOf(t)>=0;}))sc=3;
      if(sc>=0)wh.push({w:w,sc:sc});});
    wh.sort(function(a,b){return a.sc-b.sc||a.w.de.length-b.w.de.length;});
  }
  var vm=VERBS?vsearchAll(toks):[];
  var hits=[];
  SIX.forEach(function(e){
    var tm=toks.every(function(t){return e.ft.indexOf(t)>=0;});
    var best=-1;
    for(var i=0;i<e.fl.length;i++){if(toks.every(function(t){return e.fl[i].indexOf(t)>=0;})){best=i;break;}}
    if(best<0&&!tm){var all=e.fl.join(' ');if(!toks.every(function(t){return all.indexOf(t)>=0;}))return;}
    hits.push({e:e,tm:tm,line:best});
  });
  hits.sort(function(a,b){return (b.tm-a.tm)||((b.line>=0)-(a.line>=0));});
  var h='';
  if(vm.length){h+='<div class="sec">Verbes · '+vm.length+(vm.length>15?' (15 premiers)':'')+'</div><div class="list">'+vm.slice(0,15).map(vhitRow).join('')+'</div>';}
  if(wh.length){h+='<div class="sec">Mots du dictionnaire · '+wh.length+(wh.length>25?' (25 premiers)':'')+'</div><div class="list">';
    wh.slice(0,25).forEach(function(x){h+='<div class="row"><span class="t" data-lesson="'+x.w.l+'" data-find="'+esc(x.w.de)+'" style="cursor:pointer"><b class="de">'+hl(x.w.de,toks)+'</b><div class="frc">'+hl(x.w.fr,toks)+'</div><button class="snip" style="background:none;border:0;padding:0;text-align:left;text-decoration:underline" data-lesson="'+x.w.l+'" data-find="'+esc(x.w.de)+'">📍 '+esc(LESMETA[x.w.l].title)+'</button></span>'+starBtn(x.w.de,x.w.fr,x.w.l)+'<button class="spk" data-speak="'+esc(x.w.de)+'" aria-label="Écouter">&#128266;</button></div>';});
    h+='</div>';}
  h+='<div class="sec">Fiches · '+hits.length+' résultat'+(hits.length>1?'s':'')+(hits.length>40?' (40 premiers)':'')+'</div><div class="list">';
  hits.slice(0,40).forEach(function(x){
    var sn=x.line>=0?x.e.lines[x.line]:'';
    if(sn.length>150)sn=sn.slice(0,150)+'…';
    h+='<button class="row" data-lesson="'+x.e.id+'" data-find="'+esc(SQ.trim())+'"><span class="t"><b>'+hl(x.e.title,toks)+'</b>'+(sn?'<div class="snip">'+hl(sn,toks)+'</div>':'')+'<small>'+esc(LESMETA[x.e.id].catname)+'</small></span><span class="chev">&rsaquo;</span></button>';});
  res.innerHTML=h+'</div>';
}

function vsearchAll(toks){
  var qq=toks.join(' '),res=[];
  VERBS.forEach(function(v){
    var sc=-1,fm='';
    if(v.k===qq||v.fi===qq)sc=0;
    else if(toks.every(function(t){return v.fi.indexOf(t)>=0;}))sc=1;
    else if(toks.every(function(t){return v.ff.indexOf(t)>=0;}))sc=2;
    else if(qq.length>=3){
      if(!v.fa)v.fa=fold(v.t.map(function(r){return r.join('|');}).join('|'));
      if(v.fa.indexOf(qq)>=0){
        sc=3;
        outer:for(var ti=0;ti<6;ti++)for(var pi=0;pi<6;pi++){if(fold(v.t[ti][pi]).indexOf(qq)>=0){fm=TN[ti][0]+' · '+PSAY[pi]+' '+v.t[ti][pi];break outer;}}
      }
    }
    if(sc>=0)res.push({v:v,sc:sc,fm:fm});
  });
  res.sort(function(a,b){return a.sc-b.sc||a.v.k.length-b.v.k.length;});
  return res;
}

/* ---------- conjugaison : questions de quiz et cartes ---------- */
function vQ(v,ti,pi){
  if(ti===undefined)ti=Math.floor(Math.random()*6);
  if(pi===undefined)pi=Math.floor(Math.random()*6);
  var ok=v.t[ti][pi],pool=[];
  v.t[ti].forEach(function(f,i){if(i!==pi&&f!==ok&&pool.indexOf(f)<0)pool.push(f);});
  if(pool.length<3)v.t.forEach(function(r,i){if(i!==ti){var f=r[pi];if(f!==ok&&pool.indexOf(f)<0)pool.push(f);}});
  var tries=0;
  while(pool.length<3&&tries++<30){var w=VERBS[Math.floor(Math.random()*VERBS.length)],f=w.t[ti][pi];if(f!==ok&&pool.indexOf(f)<0)pool.push(f);}
  var o=shuffle(shuffle(pool).slice(0,3).concat([ok]));
  return{t:'cj',q:v.i+' — '+v.f,hint:TN[ti][0]+' · '+PERS[pi],o:o,a:o.indexOf(ok)};
}
function vpoolFor(scope){
  var arr,single=scope.indexOf('vv-')===0;
  if(scope==='kv')arr=VERBS;
  else if(scope.indexOf('vg-')===0)arr=VERBS.filter(function(v){return v.s===scope.slice(3);});
  else arr=[VERBS[+scope.slice(3)]];
  var qs=[];
  arr.forEach(function(v){
    if(single){for(var ti=0;ti<6;ti++)for(var pi=0;pi<6;pi++)qs.push(vQ(v,ti,pi));}
    else{qs.push(vQ(v));qs.push(vQ(v));}
  });
  return{c:arr.map(function(v){return[v.i,v.f,vParts(v)];}),q:qs};
}

   '<h4>Les petites règles</h4><ul>'+

  // 5
  h+=gS(5,'haben ou sein au passé composé ?',

   gE([['Ich stehe jeden Tag um sechs Uhr auf.','Je me lève tous les jours à six heures.'],['Ich weiß, dass er früh aufsteht.','Je sais qu’il se lève tôt.'],['Es ist schwer, früh aufzustehen.','C’est dur de se lever tôt. (zu s’intercale)'],['Ich muss früh aufstehen.','Je dois me lever tôt.'],['Steh auf!','Lève-toi !']]));

   '<div class="note"><b>Préfixes à double emploi</b> (<span class="de">durch-, über-, um-, unter-, wieder-, hinter-</span>) : tantôt séparables, tantôt non. <span class="de">Ich übersetze den Text.</span> (traduire, inséparable, participe <span class="de">übersetzt</span>) ≠ <span class="de">Er setzt uns über den Fluss über.</span> (faire traverser, séparable, participe <span class="de">übergesetzt</span>).</div>');

    ['können','kann','kannst','kann','können','könnt','können'],['müssen','muss','musst','muss','müssen','müsst','müssen'],['dürfen','darf','darfst','darf','dürfen','dürft','dürfen'],['wollen','will','willst','will','wollen','wollt','wollen'],['sollen','soll','sollst','soll','sollen','sollt','sollen'],['mögen','mag','magst','mag','mögen','mögt','mögen'],['möchten','möchte','möchtest','möchte','möchten','möchtet','möchten']],[0,1,2,3,4,5,6])+
   '<p><b>Règle d’or</b> : <span class="de">ich</span> et <span class="de">er/sie/es</span> n’ont <b>aucune terminaison</b>. Le modal est en 2e position, l’infinitif (sans <span class="de">zu</span>) en fin de phrase.</p>'+

   gT(['Personne','sein','haben','werden'],[['ich','war','hatte','wurde'],['du','warst','hattest','wurdest'],['er/sie/es','war','hatte','wurde'],['wir','waren','hatten','wurden'],['ihr','wart','hattet','wurdet'],['sie/Sie','waren','hatten','wurden'],['Partizip II','gewesen','gehabt','geworden / worden']],[1,2,3])+

/* ---------- fiches par catégorie de verbes ---------- */
function cD(x){return '<span class="de">'+x+'</span>';}
function cU(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';}
function cFind(inf){var r=null;VERBS.forEach(function(x){if(x.i===inf)r=x;});return r;}
function cN(sec){return VERBS.filter(function(v){return v.s===sec;}).length;}
function cNote(x){return '<div class="note">'+x+'</div>';}
function cScroll(){return '<p style="color:var(--muted);font-size:.85rem;margin:4px 0">Faites défiler le tableau vers la droite. Touchez une forme pour l’écouter.</p>';}
function cModel(inf){
  var v=cFind(inf);if(!v)return '';
  var rows=v.t.map(function(r,ti){return ['<b>'+TN[ti][0]+'</b><br>'+TN[ti][1]].concat(r);});
  return '<h4>Modèle complet : '+esc(v.i)+' ('+esc(v.f)+')</h4>'+gT(['Temps'].concat(PERS),rows,[1,2,3,4,5,6])+cScroll()+gL([v.i]);
}
function cList(names,title){
  var ok=names.filter(function(n){return cFind(n);}),rows=ok.map(function(n){var v=cFind(n);return [v.i,v.t[0][2],v.t[1][0],v.p,v.a+'<br><small>'+esc(v.f)+'</small>'];});
  return (title?'<h4>'+title+'</h4>':'')+gT(['Infinitif','Présent er/sie/es','Prétérit ich','Participe II','Perfekt avec'],rows,[0,1,2,3])+cScroll()+gL(ok);
}
function cCard(rows){return '<h4>Carte d’identité</h4>'+gT(['Critère','À savoir'],rows);}
function cSecs(o){
  return gS(1,'En bref : définition et reconnaissance',o.bref,true)+
   gS(2,'Conjuguer pas à pas',o.conj)+
   gS(3,'Exemples à écouter',gE(o.ex))+
   gS(4,'Pièges et erreurs fréquentes',o.pieges)+
   gS(5,'À retenir',o.retenir);
}
function catHTML(sec){
  var f=CATF[sec];if(!f)return '';
  var o=f();
  return '<div class="gintro"><h2>'+o.titre+'</h2><p style="margin:0">'+o.def+'</p></div>'+cSecs(o);
}
function catPick(){
  var h='<div class="gintro"><h2>Quelle est la famille de mon verbe ?</h2><p style="margin:0;color:var(--muted)">Chaque verbe appartient à une famille, et la famille dit comment le conjuguer. Posez-vous ces questions dans l’ordre :</p><ol>'+
   '<li>C’est <span class="de">sein, haben</span> ou <span class="de">werden</span> ? → <b>Auxiliaires</b>.</li>'+
   '<li>C’est <span class="de">können, müssen, dürfen, wollen, sollen, mögen</span> ? → <b>Modaux</b>.</li>'+
   '<li>Il y a <span class="de">sich</span> devant ? → <b>Pronominaux</b>.</li>'+
   '<li>Il commence par <span class="de">ab-, an-, auf-, aus-, ein-, mit-, vor-, zu-…</span> et la particule se détache ? → <b>Séparables</b>.</li>'+
   '<li>C’est <span class="de">bringen, denken, kennen, nennen, rennen, wissen</span> (ou un verbe formé dessus) ? → <b>Mixtes</b>.</li>'+
   '<li>Il commence par <span class="de">be-, emp-, ent-, er-, ge-, ver-, zer-</span> ? → <b>Inséparables</b> (les inséparables <b>forts</b> sont rangés avec les <b>Forts</b>).</li>'+
   '<li>Sinon : prétérit en <span class="de">-te</span> → <b>Faibles</b> ; la voyelle du radical change → <b>Forts</b>.</li></ol>'+
   '<div class="vlinks">'+VGROUPS.map(function(g){return '<button class="chip" data-vgroup="'+g[0]+'">'+esc(g[1].replace(' (réfléchis)','').replace(' / réguliers','').replace(' / irréguliers',''))+'</button>';}).join('')+'</div>'+
   cNote('<b>Deux étiquettes ?</b> Un verbe peut cumuler deux caractéristiques, par exemple <span class="de">aufstehen</span> : <i>fort · séparable (auf-)</i>. Il est alors rangé dans <b>un seul</b> groupe (ici Séparables) et sa fiche affiche les deux étiquettes. Chaque groupe a sa fiche explicative en haut de la liste.')+'</div>';
  return h;
}
var CATF={};

/* --- auxiliaires --- */
CATF.aux=function(){return{
 titre:'Les auxiliaires : sein, haben, werden',

 bref:'<p>Ces verbes sont <b>irréguliers</b> : aucune règle ne permet de les deviner, il faut les apprendre par cœur dès le début.</p>'+

 ex:[['Ich bin müde.','Je suis fatigué.'],['Ich habe Hunger.','J’ai faim.'],['Es wird kalt.','Il commence à faire froid.'],['Ich werde morgen kommen.','Je viendrai demain.'],['Das Haus wird gebaut.','La maison est en construction (passif).'],['Ich wurde in Berlin geboren.','Je suis né à Berlin.'],['Wir waren gestern im Kino.','Nous étions au cinéma hier.']],

  '<b>werden ≠ vouloir</b> : <span class="de">Ich werde kommen.</span> = je viendrai. « Je veux » se dit <span class="de">ich will</span> (voir les modaux).',

 ]),

/* --- faibles --- */
CATF.faible=function(){return{
 titre:'Les verbes faibles (réguliers)',
 def:'Ce sont les verbes les plus faciles : <b>la voyelle du radical ne change jamais</b>. On ajoute <b>-te</b> au prétérit et on forme le participe II avec <b>ge- … -t</b>. La grande majorité des verbes nouveaux sont faibles.',
 bref:'<p>Pour trouver le radical, enlevez <b class="de">-en</b> (ou <b class="de">-n</b>) de l’infinitif : <span class="de">machen → mach-</span>, <span class="de">wandern → wander-</span>.</p>'+
  cCard([
   ['Présent','radical + -e, -st, -t, -en, -t, -en'],
   ['Prétérit','radical + <b class="de">-te</b>, -test, -te, -ten, -tet, -ten'],
   ['Participe II','<b class="de">ge-</b> + radical + <b class="de">-t</b> (<span class="de">gemacht</span>)'],
   ['Perfekt avec','<b class="de">haben</b> (sauf mouvement ou changement d’état : <span class="de">ist gereist</span>)'],
   ['Dans l’appli',cN('faible')+' verbes faibles simples']
  ])+
  '<h4>Comment le reconnaître ?</h4>'+cU(['Au prétérit, on entend <b>-te</b> : <span class="de">er machte, sie lernte, wir wohnten</span>.','Au participe II, on entend <b>-t</b> à la fin : <span class="de">gemacht, gelernt, gewohnt</span>.','Dans une liste de verbes irréguliers, il n’y figure <b>pas</b> : on le conjugue avec la règle.']),
 conj:'<h4>La formule, temps par temps</h4>'+
  gT(['Temps','Formule','Exemple : machen'],[
   ['Präsens','radical + terminaison','ich mache, du machst'],
   ['Präteritum','radical + -te, -test, -te, -ten, -tet, -ten','ich machte, du machtest'],
   ['Perfekt','haben (présent) + ge- + radical + -t','ich habe gemacht'],
   ['Plusquamperfekt','haben (prétérit) + ge- + radical + -t','ich hatte gemacht'],
   ['Futur I','werden + infinitif','ich werde machen'],
   ['Futur II','werden + participe II + haben','ich werde gemacht haben']],[2])+
  cModel('machen')+
  '<h4>Orthographe : quand ajouter un -e- ?</h4>'+
  gT(['Radical en…','Ce qui change','Exemple'],[
   ['-d, -t, -chn, -ffn, -gn, -tm','un <b>-e-</b> avant -st, -t, -te','du arbeitest · er arbeitet · ich arbeitete · gearbeitet'],
   ['-s, -ß, -z, -x','à du : seulement <b>-t</b>','du reist · du tanzt'],
   ['-ieren','<b>pas de ge-</b> au participe','studieren → studiert · telefonieren → telefoniert']],[])+
  cList(['machen','arbeiten','reisen','lernen','wohnen','studieren'],'Six verbes faibles à comparer'),
 ex:[['Ich mache meine Hausaufgaben.','Je fais mes devoirs.'],['Gestern habe ich lange gearbeitet.','Hier, j’ai travaillé longtemps.'],['Sie wohnt in Berlin.','Elle habite à Berlin.'],['Wir haben Deutsch gelernt.','Nous avons appris l’allemand.'],['Er hat Informatik studiert.','Il a étudié l’informatique.'],['Ich bin letztes Jahr nach Wien gereist.','J’ai voyagé à Vienne l’année dernière.']],
 pieges:cU([
  '<b>Verbes en -ieren</b> : pas de <i>ge-</i> → <span class="de">studiert</span> (jamais <i>gestudiert</i>).',
  '<b>Le -e- euphonique</b> : <span class="de">arbeitete, gearbeitet, du arbeitest</span> (jamais <i>arbeitte</i>).',
  '<b>Ne changez pas la voyelle</b> : <span class="de">lernen → lernte → gelernt</span>. Si la voyelle change, c’est un verbe fort ou mixte.',
  '<b>er et ihr se ressemblent</b> au présent : <span class="de">er macht, ihr macht</span>. C’est le contexte (sujet) qui distingue.',
  '<b>Sein au Perfekt</b> pour certains verbes de mouvement faibles : <span class="de">Ich bin gereist, Er ist gewandert.</span>'
 ]),
 retenir:cU([
  'Radical stable ; prétérit en <b class="de">-te</b> ; participe II en <b class="de">ge- … -t</b>.',
  'Ajouter <b>-e-</b> si le radical finit en -d, -t, -chn, -ffn, -gn, -tm.',
  'Pas de <i>ge-</i> pour les verbes en <b>-ieren</b> et les préfixes inséparables.',
  'Perfekt avec <span class="de">haben</span>, sauf mouvement et changement d’état.'
 ])
};};

/* --- forts --- */
CATF.fort=function(){return{
 titre:'Les verbes forts (irréguliers)',
 def:'Chez les verbes forts, <b>la voyelle du radical change</b> au prétérit et souvent au participe II, qui se termine en <b>-en</b>. Il faut apprendre <b>trois formes</b> : infinitif – prétérit – participe II. Cette famille contient aussi les forts à préfixe inséparable (<span class="de">verstehen, bekommen</span>).',
 bref:'<p>Un verbe fort se reconnaît à son prétérit <b>sans -te</b> et à son participe II en <b>-en</b> : <span class="de">gehen – ging – gegangen</span>.</p>'+
  cCard([
   ['Prétérit','radical modifié ; <b>aucune terminaison</b> à ich et à er/sie/es (<span class="de">ich ging, er ging</span>)'],
   ['Participe II','<b class="de">ge-</b> + radical (modifié ou non) + <b class="de">-en</b>'],
   ['Présent','la voyelle peut changer à <b>du</b> et <b>er/sie/es</b> : e → i, e → ie, a → ä, au → äu'],
   ['Perfekt avec','<span class="de">haben</span> ou <span class="de">sein</span> (mouvement : <span class="de">ist gegangen</span>)'],
   ['À apprendre','infinitif – prétérit – participe II, par familles de voyelles'],
   ['Dans l’appli',cN('fort')+' verbes (forts simples et forts inséparables)']
  ])+
  cNote('<b>Astuce :</b> les verbes dérivés suivent leur verbe de base. Sachant <span class="de">stehen – stand – gestanden</span>, vous connaissez <span class="de">verstehen – verstand – verstanden</span> et <span class="de">aufstehen – stand auf – aufgestanden</span>.'),
 conj:'<h4>La terminaison du prétérit fort</h4>'+
  gT(['Personne','Terminaison','gehen'],[['ich','aucune','ging'],['du','-st','gingst'],['er/sie/es','aucune','ging'],['wir','-en','gingen'],['ihr','-t','gingt'],['sie/Sie','-en','gingen']],[2])+
  '<h4>Les grandes familles de voyelles</h4>'+
  gT(['Famille','Infinitif – prétérit – participe II'],[
   ['ei → ie → ie','<span class="de">bleiben – blieb – geblieben</span><br><span class="de">schreiben – schrieb – geschrieben</span>'],
   ['ei → i → i','<span class="de">greifen – griff – gegriffen</span><br><span class="de">schneiden – schnitt – geschnitten</span>'],
   ['ie → o → o','<span class="de">fliegen – flog – geflogen</span><br><span class="de">ziehen – zog – gezogen</span>'],
   ['i → a → u','<span class="de">trinken – trank – getrunken</span><br><span class="de">singen – sang – gesungen</span><br><span class="de">finden – fand – gefunden</span>'],
   ['i → a → o','<span class="de">beginnen – begann – begonnen</span><br><span class="de">schwimmen – schwamm – geschwommen</span>'],
   ['e → a → o','<span class="de">helfen – half – geholfen</span><br><span class="de">nehmen – nahm – genommen</span><br><span class="de">sprechen – sprach – gesprochen</span>'],
   ['e → a → e','<span class="de">geben – gab – gegeben</span><br><span class="de">sehen – sah – gesehen</span><br><span class="de">lesen – las – gelesen</span>'],
   ['a → u → a','<span class="de">fahren – fuhr – gefahren</span><br><span class="de">tragen – trug – getragen</span><br><span class="de">waschen – wusch – gewaschen</span>'],
   ['a → ie → a','<span class="de">schlafen – schlief – geschlafen</span><br><span class="de">laufen – lief – gelaufen</span><br><span class="de">fallen – fiel – gefallen</span>'],
   ['Cas à part','<span class="de">gehen – ging – gegangen</span><br><span class="de">stehen – stand – gestanden</span><br><span class="de">tun – tat – getan</span>']
  ])+
  cModel('gehen')+
  '<h4>Au présent : la voyelle change à du et er/sie/es</h4>'+
  gT(['Changement','Exemple (ich · du · er)'],[
   ['a → ä','fahren : fahre · fährst · fährt'],['au → äu','laufen : laufe · läufst · läuft'],['e → i','geben : gebe · gibst · gibt'],['e → ie','sehen : sehe · siehst · sieht']],[])+
  cList(['gehen','sehen','fahren','trinken','geben','nehmen'],'Six verbes forts à comparer'),
 ex:[['Ich fahre jeden Tag mit dem Bus.','Je prends le bus tous les jours.'],['Er gibt mir das Buch.','Il me donne le livre.'],['Gestern ging ich früh nach Hause.','Hier, je suis rentré tôt.'],['Wir haben Wasser getrunken.','Nous avons bu de l’eau.'],['Sie ist nach Paris geflogen.','Elle a pris l’avion pour Paris.'],['Sie liest ein Buch.','Elle lit un livre.']],
 pieges:cU([
  '<b>Pas de -te</b> : <span class="de">ich ging</span> (jamais <i>ich gehte</i>) et <span class="de">gegangen</span> (jamais <i>gegeht</i>).',
  '<b>Ich et er/sie/es sont identiques</b> au prétérit, sans terminaison : <span class="de">ich sah, er sah</span> (jamais <i>ich sahte</i>).',
  '<b>Présent : la voyelle ne change pas à ich, wir, ihr, sie</b> : <span class="de">ich fahre, du fährst, er fährt, wir fahren</span>.',
  '<b>Impératif</b> : on garde e → i / ie (<span class="de">Gib! Nimm! Sieh! Lies!</span>) mais pas le ä (<span class="de">Fahr! Schlaf!</span>).',
  '<b>Les consonnes aussi peuvent changer</b> : <span class="de">ziehen – zog, leiden – litt, sitzen – saß</span>.',
  '<b>Sein ou haben ?</b> Les verbes de mouvement prennent <span class="de">sein</span> : <span class="de">ist gegangen, ist gekommen, ist geflogen</span> ; les autres <span class="de">haben</span> : <span class="de">hat gesehen, hat getrunken</span>.'
 ]),
 retenir:cU([
  'Apprenez toujours <b>trois formes</b> : infinitif – prétérit – participe II.',
  'Prétérit <b>sans terminaison</b> à ich et er/sie/es ; participe II en <b class="de">-en</b>.',
  'Au présent, voyelle modifiée seulement à <b>du</b> et <b>er/sie/es</b> (certains verbes).',
  'Les verbes dérivés (<span class="de">ansehen, verstehen…</span>) se conjuguent comme le verbe de base.',
  'Apprenez-les <b>par familles</b> de voyelles, quelques-uns par jour.'
 ])
};};

/* --- mixtes --- */
CATF.mixte=function(){return{
 titre:'Les verbes mixtes',
 def:'Un mélange des deux types : <b>la voyelle du radical change</b> comme chez les forts, mais on garde les <b>terminaisons faibles</b> (<b>-te</b> au prétérit, <b>-t</b> au participe II). Ils sont peu nombreux mais très fréquents.',
 bref:'<p>Un verbe mixte se reconnaît à son prétérit en <b>-te</b> avec une <b>voyelle changée</b> : <span class="de">denken – dachte – gedacht</span>.</p>'+
  cCard([
   ['Prétérit','radical modifié + <b class="de">-te</b> (<span class="de">ich brachte, du brachtest</span>)'],
   ['Participe II','<b class="de">ge-</b> + radical modifié + <b class="de">-t</b> (<span class="de">gebracht</span>)'],
   ['Présent','régulier (<span class="de">ich denke, du denkst</span>), sauf <span class="de">wissen</span> : <span class="de">ich weiß, du weißt, er weiß</span>'],
   ['Perfekt avec','<span class="de">haben</span> (sauf <span class="de">rennen</span> : <span class="de">ist gerannt</span>)'],
   ['Dans l’appli',cN('mixte')+' verbes mixtes (les mixtes séparables sont dans « Séparables »)']
  ])+
  '<h4>Les verbes de base à connaître</h4>'+cList(['bringen','denken','kennen','nennen','rennen','brennen','wissen']),
 conj:'<h4>La formule, temps par temps</h4>'+
  gT(['Temps','Formule','Exemple : denken'],[
   ['Präsens','radical + terminaison (comme un faible)','ich denke, du denkst'],
   ['Präteritum','radical modifié + -te, -test, -te, -ten, -tet, -ten','ich dachte, du dachtest'],
   ['Perfekt','haben + ge- + radical modifié + -t','ich habe gedacht'],
   ['Plusquamperfekt','hatte + participe II','ich hatte gedacht'],
   ['Futur I','werden + infinitif','ich werde denken'],
   ['Futur II','werden + participe II + haben','ich werde gedacht haben']],[2])+
  cModel('denken')+cModel('wissen')+
  cNote('<b>Les verbes dérivés</b> suivent le même modèle : <span class="de">erkennen – erkannte – erkannt</span>, <span class="de">verbringen – verbrachte – verbracht</span>, <span class="de">benennen – benannte – benannt</span> (pas de <i>ge-</i> avec un préfixe inséparable).'),
 ex:[['Ich kenne diesen Mann nicht.','Je ne connais pas cet homme.'],['Ich weiß, dass er kommt.','Je sais qu’il vient.'],['Er hat an seine Familie gedacht.','Il a pensé à sa famille.'],['Sie brachte uns einen Kuchen.','Elle nous a apporté un gâteau.'],['Wie nennt man das auf Deutsch?','Comment appelle-t-on cela en allemand ?'],['Das Licht hat die ganze Nacht gebrannt.','La lumière a brûlé toute la nuit.']],
 pieges:cU([
  '<b>Participe en -t, pas en -en</b> : <span class="de">gedacht, gebracht</span> (jamais un participe fort comme <i>gebringen</i>).',
  '<b>kennen ≠ wissen</b> : <span class="de">Ich kenne ihn.</span> (connaître une personne, un lieu) / <span class="de">Ich weiß, dass er kommt.</span> (savoir un fait).',
  '<b>wissen au présent</b> se conjugue comme un modal : <span class="de">ich weiß, du weißt, er weiß, wir wissen</span>.',
  '<b>La consonne change aussi</b> pour bringen et denken : <span class="de">brachte, dachte</span> (jamais <i>bringte, denkte</i>).',
  '<b>senden et wenden</b> ont deux formes possibles : <span class="de">sandte / sendete, wandte / wendete</span>.'
 ]),
 retenir:cU([
  'Voyelle des forts + terminaisons des faibles : <span class="de">-te</span> et <span class="de">-t</span>.',
  'Les 7 verbes de base : <span class="de">bringen, denken, kennen, nennen, rennen, brennen, wissen</span>.',
  'Présent régulier, sauf <span class="de">wissen</span> (ich weiß).',
  'Les dérivés (<span class="de">erkennen, verbringen…</span>) suivent le même modèle, sans <i>ge-</i>.'
 ])
};};

/* --- modaux --- */
CATF.modal=function(){
 var M=['können','müssen','dürfen','wollen','sollen','mögen'];
 var pres=M.map(function(n){var v=cFind(n);return v?[v.i].concat(v.t[0]):null;}).filter(Boolean);
 pres.push(['möchten','möchte','möchtest','möchte','möchten','möchtet','möchten']);
 var pret=M.map(function(n){var v=cFind(n);return v?[v.i,v.t[1][0],v.p,v.f]:null;}).filter(Boolean);
 return{
 titre:'Les verbes modaux',
 def:'Les modaux <b>modifient le sens d’un autre verbe</b> : capacité, obligation, permission, volonté. Ils sont irréguliers au présent. Le verbe qui les accompagne est à l’<b>infinitif, sans zu, à la fin de la phrase</b>.',
 bref:'<p>Les modaux forment une petite famille fermée. Quand vous voyez l’un d’eux, cherchez l’infinitif en fin de phrase.</p>'+
  cCard([
   ['Les verbes','<span class="de">können, müssen, dürfen, wollen, sollen, mögen</span> (+ <span class="de">möchten</span>, « je voudrais »)'],
   ['Présent','<b>ich</b> et <b>er/sie/es</b> sans terminaison (<span class="de">ich kann, er kann</span>) ; voyelle modifiée au singulier'],
   ['Prétérit','radical <b>sans Umlaut</b> + -te : <span class="de">konnte, musste, durfte, wollte, sollte, mochte</span>'],
   ['Participe II','<span class="de">gekonnt, gemusst, gedurft, gewollt, gesollt, gemocht</span> (utilisé seul)'],
   ['Perfekt avec','toujours <span class="de">haben</span>'],
   ['Construction','modal en 2e position + infinitif <b>sans zu</b> à la fin']
  ])+
  '<h4>Quel sens ?</h4>'+
  gT(['Modal','Sens','Exemple'],[
   ['können','pouvoir, savoir (capacité, possibilité)','Ich kann gut schwimmen.'],
   ['müssen','devoir (obligation, nécessité)','Ich muss arbeiten.'],
   ['dürfen','avoir le droit, pouvoir (permission)','Hier darf man nicht rauchen.'],
   ['wollen','vouloir (volonté forte)','Ich will nach Hause gehen.'],
   ['sollen','devoir (ordre d’un tiers, conseil)','Du sollst mehr schlafen.'],
   ['mögen','aimer (bien)','Ich mag Kaffee.'],
   ['möchten','souhaiter, voudrais (poli)','Ich möchte einen Tee.']],[0,2]),
 conj:'<h4>Présent : le tableau à connaître par cœur</h4>'+
  gT(['Verbe'].concat(PERS),pres,[0,1,2,3,4,5,6])+cScroll()+
  '<h4>Prétérit et participe II</h4>'+
  gT(['Verbe','Prétérit (ich, er)','Participe II','Sens'],pret,[0,1,2])+
  '<h4>Où placer le modal et l’infinitif ?</h4>'+
  gT(['Phrase','Modal','Infinitif','Exemple'],[
   ['Principale','2e position','à la fin','Ich muss heute früh aufstehen.'],
   ['Question','1re position','à la fin','Kannst du mir helfen?'],
   ['Subordonnée','tout à la fin, après l’infinitif','juste avant le modal','Ich weiß, dass er heute arbeiten muss.'],
   ['Perfekt','haben (2e position)','double infinitif à la fin','Ich habe gestern arbeiten müssen.']],[3])+
  cModel('können')+
  cNote('<b>Perfekt</b> : seul, le modal prend un participe (<span class="de">Ich habe es nicht gewollt.</span>). Avec un autre verbe, on met <b>deux infinitifs</b> : <span class="de">Ich habe nicht kommen können.</span>'),
 ex:[['Ich kann gut schwimmen.','Je sais bien nager.'],['Du musst mehr lernen.','Tu dois apprendre davantage.'],['Hier darf man nicht parken.','Ici, on n’a pas le droit de se garer.'],['Ich will einen neuen Computer kaufen.','Je veux acheter un nouvel ordinateur.'],['Wir sollen um acht Uhr da sein.','Nous devons être là à huit heures (c’est ce qu’on nous a dit).'],['Ich möchte einen Kaffee, bitte.','Je voudrais un café, s’il vous plaît.'],['Ich habe gestern arbeiten müssen.','J’ai dû travailler hier.']],
 pieges:cU([
  '<b>Pas de zu</b> : <span class="de">Ich kann schwimmen.</span> (jamais <i>ich kann zu schwimmen</i>).',
  '<b>ich will ≠ je vais</b> : <span class="de">will</span> = je veux. Le futur se fait avec <span class="de">werden</span>.',

function escRe(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function exFor(c){
  if(c.xe!==undefined)return c.xe;
  var r=null;
  try{
    var L=c.l&&LES[c.l];
    if(L&&c[0].split(/\s+/).length<=3){
      var w=fold(c[0]).replace(/^(der|die|das|ein|eine|sich) /,'').replace(/[^a-z ]/g,'').trim();
      if(w.length>2){
        var re=new RegExp('(^|[^a-z])'+escRe(w)+'[a-z]{0,3}([^a-z]|$)');
        for(var i=0;i<L.b.length;i++){var b=L.b[i];if(b.t==='ex'&&b.de&&b.fr&&b.de.length<110&&fold(b.de)!==fold(c[0])&&re.test(fold(b.de))){r={de:b.de,fr:b.fr};break;}}
      }
    }
  }catch(e){}
  c.xe=r;return r;
}

function normAns(s){return String(s).toLowerCase().replace(/[.,!?;:]+/g,' ').replace(/\s+/g,' ').trim();}
function stripPron(s){var m=/^(ich|du|er\/sie\/es|er|sie|es|wir|ihr|man)\s+(.+)$/.exec(s);return m?m[2]:s;}
function checkForm(val,correct){
  var u=normAns(val),c=normAns(correct),u2=stripPron(u);
  if(u2===c||u===c)return 2;

}

var DC={scope:'kc',n:5,len:'m',run:false,done:false,items:[],i:0,checked:false,val:'',score:0,res:[]};

function toks(s){return String(s).replace(/[„“”"«»]/g,'').split(/\s+/).map(function(w){return w.replace(/^[.,;:!?¿¡()\[\]]+|[.,;:!?()\[\]]+$/g,'');}).filter(Boolean);}
function diffHTML(ref,hyp){
  var a=toks(ref),b=toks(hyp),la=a.map(function(x){return x.toLowerCase();}),lb=b.map(function(x){return x.toLowerCase();});
  var n=a.length,m=b.length,L=[],i,j;
  for(i=0;i<=n;i++){L.push(new Array(m+1).fill(0));}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=la[i]===lb[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  var ra=[],rb=[],ok=0,cap=0;i=0;j=0;
  while(i<n&&j<m){
    if(la[i]===lb[j]){var same=a[i]===b[j];ra.push('<span class="tk '+(same?'ok':'cap')+'">'+esc(a[i])+'</span>');rb.push('<span class="tk '+(same?'ok':'cap')+'">'+esc(b[j])+'</span>');ok++;if(!same)cap++;i++;j++;}
    else if(L[i+1][j]>=L[i][j+1]){ra.push('<span class="tk no">'+esc(a[i])+'</span>');i++;}
    else{rb.push('<span class="tk wr">'+esc(b[j])+'</span>');j++;}
  }
  while(i<n){ra.push('<span class="tk no">'+esc(a[i])+'</span>');i++;}
  while(j<m){rb.push('<span class="tk wr">'+esc(b[j])+'</span>');j++;}
  return {ref:ra.join(' '),hyp:rb.join(' '),acc:n?ok/n:0,cap:cap};
}
function sentPool(scope,len){
  if(/^(kv|hard)$|^v[gv]-/.test(scope))return Promise.reject('scope');
  return poolFor(scope).then(function(P){
    var out=[],lim=LENS[len]||LENS.m,seen={};
    P.forEach(function(l){(l.b||[]).forEach(function(b){
      if(b.t==='ex'&&b.de&&b.fr){var n=b.de.split(/\s+/).length;if(n>=lim[0]&&n<=lim[1]&&!seen[b.de]){seen[b.de]=1;out.push({de:b.de,fr:b.fr});}}
    });});
    return out;
  });
}

var LV_NAMES=['A1','A2','B1','B2'];

function qByCats(cids,types){var out=[];ORDER.forEach(function(id){var m=LESMETA[id];if(cids.indexOf(m.cat)<0)return;var L=LES[id];if(!L)return;L.q.forEach(function(q){if(!types||types.indexOf(q.t)>=0)out.push(q);});});return out;}

function buildExam(lv){
  var cats=lv==='B1'?LVCAT.A2.concat(LVCAT.B1):LVCAT.B1.concat(LVCAT.B2),nV=lv==='B1'?16:18,nC=lv==='B1'?10:12,nJ=lv==='B1'?14:20;
  return Promise.all([loadAll(),loadVerbs()]).then(function(){
    var out=[],cl=qByCats(cats,['cl']);
    if(cl.length<nC)cl=cl.concat(qByCats(LVCAT.A2.concat(LVCAT.B1,LVCAT.B2),['cl'])).filter(function(x,i,a){return a.indexOf(x)===i;});
    pickN(qByCats(cats,['tr','rt']),nV+Math.max(0,nC-Math.min(nC,cl.length))).forEach(function(q){out.push({q:q,sec:'Vocabulaire'});});
    pickN(cl,nC).forEach(function(q){out.push({q:q,sec:'Grammaire'});});
    var tn=lv==='B1'?[0,1,2,3]:[0,1,2,3,4,5];

var smTimer=null;

function smMk(q){return q.o.map(function(t,i){return {t:t,c:i===q.a};});}
function smBuild(lv){
  return Promise.all([loadSim(),loadAll(),loadVerbs()]).then(function(){
    var D=SIMD[lv],pages=[];
    D.lesen.forEach(function(t){t.q.forEach(function(q){pages.push({sec:'l',k:'q',q:q,tt:t.t,tx:t.x,opts:shuffle(smMk(q))});});});
    D.horen.forEach(function(t,ti){t.q.forEach(function(q){pages.push({sec:'h',k:'q',q:q,tt:t.t,au:t.x,aid:'h'+ti,opts:shuffle(smMk(q))});});});
    var n={A1:10,A2:12,B1:14,B2:16}[lv],nc=Math.round(n/4),tn={A1:[0],A2:[0,1,2],B1:[0,1,2,3],B2:[0,1,2,3,4,5]}[lv];
    var cl=qByCats(LVCAT[lv],['cl']);if(cl.length<n-nc)cl=cl.concat(qByCats(LVCAT[lv],['tr','rt']));
    var gq=pickN(cl,n-nc);
    for(var i=0;i<nc;i++){var v=VERBS[Math.floor(Math.random()*VERBS.length)];gq.push(vQ(v,tn[Math.floor(Math.random()*tn.length)]));}
    gq.forEach(function(q){pages.push({sec:'g',k:'q',q:q,opts:shuffle(smMk(q))});});

function smFinish(timeout){

  if(d.simplay!==undefined){var pg=SM.pages.filter(function(x){return x.aid===d.simplay;})[0];if((SM.plays[d.simplay]||0)>=2)return;SM.plays[d.simplay]=(SM.plays[d.simplay]||0)+1;speak(pg.au);var left=2-SM.plays[d.simplay];b.textContent='▶ Écouter ('+left+' écoute'+(left>1?'s':'')+' restante'+(left>1?'s':'')+')';if(left<=0)b.disabled=true;return;}
  if(d.schk!==undefined){SM.chk[d.schk]=!SM.chk[d.schk];var on=!!SM.chk[d.schk];b.classList.toggle('done',on);b.setAttribute('aria-pressed',on);b.querySelector('.n').innerHTML=on?'&#10003;':'·';return;}
});
document.addEventListener('input',function(e){if(e.target.id!=='ans'||!SM.run||SM.pages[SM.i].k!=='w')return;SM.wr=e.target.value;var n=SM.wr.trim()?SM.wr.trim().split(/\s+/).length:0,el=document.getElementById('swc');if(el)el.textContent=n+' mot'+(n>1?'s':'')+' · minimum conseillé : '+SIMD[SM.lv].schreiben.min;});
function lvToPlan(){
  var est=S.level&&S.level.est||'A0',next={'A0 (débutant)':1,'A1':4,'A2':11,'B1':14,'B2':99}[est];
  return loadPlan().then(function(){
    if(next===99)return 16*7;
    for(var j=0;j<16*7;j++){if(planDayIds(j).some(function(id){return LESMETA[id].k==='c'&&LESMETA[id].cat>=next;}))return j;}
    return 0;
  });
}

/* ====================== réglages, progrès, rappels ====================== */
function LN(){try{return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications||null;}catch(e){return null;}}
function setReminder(on,time){
  var ln=LN();
  if(!ln){toast('Les rappels fonctionnent dans l’application Android installée (APK).');return Promise.resolve(false);}
  return Promise.resolve().then(function(){return ln.cancel({notifications:[{id:1001}]});}).catch(function(){}).then(function(){
    if(!on)return true;
    return ln.requestPermissions().then(function(p){
      if(!p||p.display!=='granted'){toast('Autorisez les notifications pour activer le rappel.');return false;}
      var hm=String(time||'19:00').split(':');
      return ln.schedule({notifications:[{id:1001,title:'Allemand 0 → B2',body:'C’est l’heure de votre séance : cartes à revoir et fiche du jour.',schedule:{on:{hour:+hm[0],minute:+hm[1]},allowWhileIdle:true},smallIcon:'ic_stat_notify'}]}).then(function(){return true;});
    });
  }).catch(function(){toast('Rappel impossible à programmer sur cet appareil.');return false;});
}
function setExtra(){
  var h='<div class="sec">Confort d’étude</div><div class="setc"><b>Genres en couleur</b>'+seg('genre',[['true','Oui'],['false','Non']])+'<small><span class="g-der">der</span> masculin · <span class="g-die">die</span> féminin/pluriel · <span class="g-das">das</span> neutre</small></div>';
  h+='<div class="setc"><b>Reprendre là où je me suis arrêté</b>'+seg('resume',[['true','Oui'],['false','Non']])+'<small>À l’ouverture, l’application revient à l’écran, à la position et à la série en cours.</small></div>';
  h+='<div class="setc"><b>Rappel quotidien</b><div class="seg"><button data-remind="1" aria-pressed="'+(!!G('remind'))+'">Activé</button><button data-remind="0" aria-pressed="'+(!G('remind'))+'">Désactivé</button></div><div class="crow"><span>Heure du rappel</span><input type="time" id="rtime" value="'+esc(G('rtime'))+'" aria-label="Heure du rappel"></div><small>'+(LN()?'Une notification par jour à l’heure choisie.':'Disponible dans l’application Android installée (APK).')+'</small></div>';
  return h;
}
function progExtra(){
  var h='<div class="list" style="margin:6px 0 4px">'+trow('🕘','Historique','Leçons, quiz, cartes, examens · '+(S.hist||[]).length+' activités','hist')+trow('📅','Plan d’étude de 4 mois',S.plan?'Voir mon plan':'Démarrer le plan','plan')+trow('★','Mes mots difficiles',Object.keys(S.hard).length+' mots','hard')+'</div>';
  if(S.level)h+='<div class="sec">Niveau estimé</div><div class="setc"><b>'+esc(S.level.est)+'</b><small>'+esc(S.level.d)+' · '+LV_NAMES.map(function(l){return l+' '+S.level.by[l]+' %';}).join(' · ')+'</small></div>';
  if((S.exams||[]).length)h+='<div class="sec">Examens blancs</div><div class="list">'+S.exams.slice(0,4).map(function(e){return '<div class="row"><span class="n">'+e.lv+'</span><span class="t"><b>'+e.ok+' / '+e.n+' · '+Math.round(e.ok/e.n*100)+' %</b><small>'+esc(e.d)+'</small></span></div>';}).join('')+'</div>';
  return h;
}

/* ====================== événements des nouveautés ====================== */
document.addEventListener('change',function(e){
  var s=e.target.closest('#scopesel');
  if(s&&(s.dataset.scope==='dictee'||s.dataset.scope==='pron')){e.stopPropagation();if(s.dataset.scope==='dictee')DC.scope=s.value;else PR.scope=s.value;return;}
  if(e.target.id==='vtscope'){VT.scope=e.target.value;return;}
  if(e.target.id==='vttense'){VT.tense=e.target.value;return;}
  if(e.target.id==='rtime'){S.set.rtime=e.target.value||'19:00';save();if(G('remind'))setReminder(true,G('rtime'));}
},true);
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.id!=='ans'||e.target.tagName==='TEXTAREA'&&e.shiftKey)return;
  e.preventDefault();
  if(V.name==='vtrain'&&VT.run){if(VT.checked)return vtNext();return vtCheck();}
  if(V.name==='dictee'&&DC.run){if(DC.checked)return dcNext();return dcCheck();}
});
function vtNext(){VT.i++;VT.checked=false;VT.val='';if(VT.i>=VT.qs.length)return vtFinish();vtDraw();}
function dcNext(){DC.i++;DC.checked=false;DC.val='';if(DC.i>=DC.items.length)return dcFinish();dcDraw();}
function prNext(){PR.i++;PR.has=false;PR.heard='';PR.rec=false;if(PR.i>=PR.items.length)return prFinish();prDraw();}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-pgo],[data-pstart],[data-preplan],[data-pstop],[data-ptask],[data-hf],[data-hclear],[data-hardgo],[data-remind],[data-vtn],[data-vtstart],[data-vtcheck],[data-vtnext],[data-vtquit],[data-vtretry],[data-vtagain],[data-dcl],[data-dcn],[data-dcstart],[data-dcplay],[data-dccheck],[data-dcnext],[data-dcquit],[data-dcagain],[data-prn],[data-prstart],[data-prplay],[data-prlisten],[data-prrec],[data-prreplay],[data-prgrade],[data-prquit],[data-pragain],[data-mnew],[data-mopt],[data-mnext],[data-mquit],[data-mexit],[data-lvplan]');
  if(!t)return;
  var d=t.dataset,k;
  if(d.go)return go({name:d.go});
  if(d.pgo!==undefined){
    var a=d.pgo.split(':'),n=a[0],arg=a[1]||'';
    if(n==='cards'){FC.scope=arg||'all';FC.started=false;return go({name:'cards'});}
    if(n==='quiz'){Q.scope=arg||'all';Q.running=false;return go({name:'quiz'});}
    if(n==='dictee'){DC.scope=arg||'kc';DC.run=false;DC.done=false;return go({name:'dictee'});}
    if(n==='exam'){M.run=false;M.done=false;M.kind=null;go({name:'exam'});return mStart('exam',arg);}
    if(n==='level'){M.run=false;M.done=false;M.kind=null;return go({name:'level'});}
    return go({name:n});
  }
  if(d.pstart!==undefined){var el=document.getElementById('pstart'),v=el&&el.value||today();
    if(!S.plan)S.plan={start:v,chk:{}};else S.plan.start=v;save();hlog('plan','','Plan de 4 mois : départ le '+v);toast('Plan enregistré');return vPlan();}
  if(d.preplan!==undefined){var j=firstUndone();S.plan.start=ymd(addDays(today(),-j));save();toast('Plan recalé sur votre avancement');return vPlan();}
  if(d.pstop!==undefined){if(confirm('Arrêter le plan d’étude ? Votre progression (leçons terminées, cartes) est conservée.')){S.plan=null;save();vPlan();}return;}
  if(d.ptask!==undefined){var i=planIdx();if(i<0)return;S.plan.chk=S.plan.chk||{};var key='i'+i+':'+d.ptask;if(S.plan.chk[key])delete S.plan.chk[key];else S.plan.chk[key]=1;save();return vPlan();}
  if(d.hf){HF=d.hf;return vHist();}
  if(d.hclear!==undefined){if(confirm('Effacer tout l’historique ?')){S.hist=[];save();vHist();}return;}
  if(d.hardgo){if(d.hardgo==='cards'){FC.scope='hard';FC.started=false;return go({name:'cards'});}Q.scope='hard';Q.running=false;return go({name:'quiz'});}
  if(d.remind!==undefined){var on=d.remind==='1';setReminder(on,G('rtime')).then(function(ok){S.set.remind=on&&ok;save();if(V.name==='set')render();if(on&&ok)toast('Rappel programmé à '+G('rtime'));});return;}
  /* verbes */
  if(d.vtn){VT.n=+d.vtn;return vVtrain();}
  if(d.vtstart!==undefined)return vtStart();
  if(d.vtcheck!==undefined)return vtCheck();
  if(d.vtnext!==undefined)return vtNext();
  if(d.vtquit!==undefined){VT.run=false;VT.done=false;persist(true);return vVtrain();}
  if(d.vtretry!==undefined){return vtStart(VT.res.filter(function(r){return !r.ok;}).map(function(r){return r.q;}));}
  if(d.vtagain!==undefined){VT.done=false;return vVtrain();}
  /* dictée */
  if(d.dcl){DC.len=d.dcl;return vDictee();}
  if(d.dcn){DC.n=+d.dcn;return vDictee();}
  if(d.dcstart!==undefined)return dcStart();
  if(d.dcplay!==undefined){var it=DC.items[DC.i];return speakRate(it.de,d.dcplay==='slow'?.55:G('rate'));}
  if(d.dccheck!==undefined)return dcCheck();
  if(d.dcnext!==undefined)return dcNext();
  if(d.dcquit!==undefined){DC.run=false;DC.done=false;persist(true);return vDictee();}
  if(d.dcagain!==undefined){DC.done=false;return vDictee();}
  /* prononciation */
  if(d.prn){PR.n=+d.prn;return vPron();}
  if(d.prstart!==undefined)return prStart();
  if(d.prplay!==undefined)return speakRate(PR.items[PR.i].de,d.prplay==='slow'?.55:G('rate'));
  if(d.prlisten!==undefined)return prListen();
  if(d.prrec!==undefined)return prRec();
  if(d.prreplay!==undefined){try{new Audio(REC.url).play();}catch(er){toast('Lecture impossible');}return;}
  if(d.prgrade!==undefined){
    var itm=PR.items[PR.i];
    if(d.prgrade==='1')PR.good++;else if(d.prgrade==='0'){PR.bad++;var kk=ckey(itm.de);if(!S.hard[kk])S.hard[kk]={d:itm.de,f:itm.fr,l:''};save();}
    return prNext();
  }
  if(d.prquit!==undefined){PR.run=false;PR.done=false;return vPron();}
  if(d.pragain!==undefined){PR.done=false;return vPron();}
  /* tests */
  if(d.mnew){var p=d.mnew.split(':');return mStart(p[0],p[1]||'');}
  if(d.mopt!==undefined){M.ans=+d.mopt;return mDraw();}
  if(d.mnext!==undefined){if(M.ans<0)return;return mNext();}
  if(d.mquit!==undefined){if(confirm('Abandonner ce test ? Les réponses données seront perdues.')){clearInterval(mTimer);M.run=false;M.done=false;persist(true);if(M.kind==='level')vLevel();else vExam();}return;}
  if(d.mexit!==undefined){M.done=false;M.kind=null;return vExam();}
  if(d.lvplan!==undefined){lvToPlan().then(function(j){var st=ymd(addDays(today(),-j));if(S.plan)S.plan.start=st;else S.plan={start:st,chk:{}};save();toast('Plan positionné sur votre niveau');go({name:'plan'});});return;}
});
/* ====================== lancement : reprise de l’écran, de la position et de la série ====================== */
function persistExtra(r){
  if(M.run&&M.qs.length)r.M={kind:M.kind,lv:M.lv,qs:M.qs,i:M.i,ans:M.ans,opts:M.opts,res:M.res,t0:M.t0,limit:M.limit};
  if(VT.run)r.VT=VT;
  if(DC.run)r.DC=DC;
}
function bootView(){
  var ok=false;
  if(G('resume')){
    try{
      var r=JSON.parse(localStorage.getItem(RKEY)||'null');
      if(r&&r.HS&&r.HS.length){
        var hs=r.HS.filter(function(x){return x&&x.v&&x.v.name;});
        if(hs.length){
          HS=hs;hi=Math.max(0,Math.min(r.hi|0,HS.length-1));V=HS[hi].v;T=r.T||'home';TS=(r.TS&&typeof r.TS==='object')?r.TS:{};delete TS[T];
          if(V.name==='lesson'&&!LESMETA[V.id]){HS=[{v:{name:'home'},sy:0}];hi=0;V=HS[0].v;T='home';}
          if(r.FC&&r.FC.queue&&r.FC.queue.length){
            FC.scope=r.FC.scope;FC.queue=r.FC.queue.map(function(x){var c=x.c;c.l=x.l;return c;});FC.i=r.FC.i;FC.flip=r.FC.flip;FC.total=r.FC.total;FC.known=r.FC.known;FC.started=true;FC.all=FC.queue.slice();
          }
          if(r.Q&&r.Q.qs&&r.Q.qs.length){Q.scope=r.Q.scope;Q.qs=r.Q.qs;Q.i=r.Q.i;Q.score=r.Q.score;Q.answered=r.Q.answered;Q.opts=r.Q.opts;Q.running=true;}
          if(r.M&&r.M.qs){M.kind=r.M.kind;M.lv=r.M.lv;M.qs=r.M.qs;M.i=r.M.i;M.ans=r.M.ans;M.opts=r.M.opts;M.res=r.M.res;M.t0=r.M.t0;M.limit=r.M.limit;M.run=true;M.done=false;if(M.limit)mTimer=setInterval(mTick,1000);}
          if(r.VT&&r.VT.run){for(var a in r.VT)VT[a]=r.VT[a];}
          if(r.DC&&r.DC.run){for(var b in r.DC)DC[b]=r.DC[b];}
          PENDY=HS[hi].sy||0;ok=true;
        }
      }
    }catch(e){ok=false;}
  }
  if(!ok){HS=[{v:{name:'home'},sy:0}];hi=0;V=HS[0].v;T='home';TS={};}
  render();syncGuard();
}

try{window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){if(G('theme')==='auto')applySettings();});}catch(e){}

loadMeta().then(function(){bootView();}).catch(function(){app.innerHTML='<div class="empty">Impossible de charger le cours. Vérifiez la connexion puis rouvrez la page.</div>';});
})();
