<style>
/* Layout: mobile-first course reader. Fixed bottom tab bar (Cours, Cartes, Quiz, Recherche, Progrès); content in one column, max 720px. Palette: cool paper, petrol green accent, marker-yellow highlight for German. */
*{box-sizing:border-box}
html,body{margin:0}
html{font-size:var(--root,100%)}
body{color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:var(--lh,1.5);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px;-webkit-text-size-adjust:100%}

.hero{padding:18px 0 8px}

.cont{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:14px 0;padding:14px 16px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink)}

.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin:10px 0 4px}.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:42px;font-weight:600;color:var(--muted)}.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}

.bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}

.chev{color:var(--muted);flex:none}
.setc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;flex-direction:column;gap:8px}.crow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.crow a{color:var(--accent);font-weight:600;overflow-wrap:anywhere;min-width:0}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between}.crow span{min-width:0;overflow-wrap:anywhere;user-select:all}a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.setc small{color:var(--muted)}.setc .seg{margin:0}.setc .seg button{font-size:.88rem;padding:4px 6px;line-height:1.15}.setc input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}.fsrow{display:flex;justify-content:space-between;color:var(--muted)}.demo{margin:0;padding:10px;border-radius:10px;background:var(--surface2)}textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;min-width:0;resize:vertical}

.ex{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px 8px 12px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}

.de{font-weight:700;color:var(--de)}.frc{color:var(--frc)}.de2{color:var(--de);font-weight:600}
.ex .fr{display:block;color:var(--frc);font-size:.92rem}
.hidefr .fr{display:none}.hidefr.show .fr{display:block}.hidefr .tx::after{content:"Touchez pour voir la traduction";display:block;font-size:.78rem;color:var(--muted)}.hidefr.show .tx::after{display:none}
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:1rem}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;min-width:78px}
th{background:var(--surface2);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.de{cursor:pointer}td.de::after{content:"";}.legend{display:flex;gap:14px;font-size:.85rem;margin:6px 0 0}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:currentColor}
.fcard .big.de{font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.wide{flex:1}
.pager{display:flex;gap:8px;margin:20px 0}
.pager .btn{flex:1;text-align:left;font-weight:600;line-height:1.2;min-width:0}
.pager small{display:block;color:var(--muted);font-weight:400}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);border-radius:10px;min-height:48px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
/* cards */
.scope{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;min-width:0;max-width:100%}
select{flex:1}
.fc{perspective:900px;margin:10px 0}
.fcard{min-height:240px;width:100%;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 6px 24px -14px rgba(0,0,0,.35)}
.fcard .side{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fcard .big{font-family:var(--f-display);font-size:1.7rem;line-height:1.25;overflow-wrap:anywhere}
.fcard.back{background:var(--accent-soft)}
.prog{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
/* quiz */
.q{margin:8px 0}
.q .qt{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.q .qq{font-family:var(--f-display);font-size:1.4rem;line-height:1.25;margin:6px 0 4px;overflow-wrap:anywhere}
.q .hint{color:var(--muted);font-style:italic;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:48px;line-height:1.3}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.score{text-align:center;padding:22px 10px}
.score b{display:block;font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.fnd{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px;box-shadow:0 0 0 2px var(--mark)}.fnd.cur{outline:3px solid var(--accent);outline-offset:1px;animation:fpulse 1s ease 2}@keyframes fpulse{50%{box-shadow:0 0 0 7px rgba(255,200,0,.5)}}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.snip{color:var(--muted);font-size:.9rem;margin-top:2px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw;font-size:.9rem}
.spin{padding:40px;text-align:center;color:var(--muted)}
.pbar{display:flex;flex-direction:column;gap:12px}
.pbar .l{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.pbar .l span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
@media (prefers-reduced-motion:no-preference){.fcard{transition:transform .2s}.fcard:active{transform:scale(.985)}}
/* ===== Palette "verre" : bleu nuit, turquoise, violet (modèle de la capture) ===== */
:root{
  --bg:#0a1222; --solid:#14233f; --surface:rgba(255,255,255,.07); --surface2:rgba(255,255,255,.11); --ink:#EAF0FA; --muted:#9FB1CC; --line:rgba(255,255,255,.14);
  --de:#8CC0FF; --frc:#6EE0B2; --accent:#4A90E2; --accent-ink:#FFFFFF; --accent-soft:rgba(74,144,226,.20); --mark:#F2B705; --mark-ink:#1B1400;
  --good:#22A27A; --good-soft:rgba(34,162,122,.22); --bad:#E5645A; --bad-soft:rgba(229,100,90,.22);

  --bgimg:radial-gradient(120% 55% at 0% 0%,#1b3d78 0%,rgba(23,50,97,0) 62%),radial-gradient(90% 45% at 100% 42%,#0d4656 0%,rgba(12,61,77,0) 70%),radial-gradient(120% 55% at 0% 100%,#2d2860 0%,rgba(39,35,81,0) 66%),linear-gradient(180deg,#0a1222,#0a1222);
  --f-display:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif; --f-body:Roboto,'Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EAF1FB; --solid:#FFFFFF; --surface:rgba(255,255,255,.72); --surface2:rgba(20,50,100,.08); --ink:#12213A; --muted:#566985; --line:rgba(20,50,100,.15);
  --de:#1D5FC4; --frc:#0F7F57; --accent:#2F7BD6; --accent-ink:#FFFFFF; --accent-soft:rgba(47,123,214,.14); --mark:#FFD866; --mark-ink:#3B2D00;
  --good:#1D7A45; --good-soft:rgba(29,122,69,.16); --bad:#B13A30; --bad-soft:rgba(177,58,48,.14); --gold:#C58F00;
  --bgimg:radial-gradient(120% 55% at 0% 0%,#cfe0fb 0%,rgba(207,224,251,0) 62%),radial-gradient(90% 45% at 100% 42%,#cdeef0 0%,rgba(205,238,240,0) 70%),radial-gradient(120% 55% at 0% 100%,#e0dcfa 0%,rgba(224,220,250,0) 66%),linear-gradient(180deg,#eef3fb,#eef3fb);
  color-scheme:light;
}
html{background:var(--bg)}
body{background:transparent;padding-block:0 104px}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg)}
body::before{background:transparent;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
option{background:var(--solid);color:var(--ink)}
.top{background:rgba(10,18,34,.55);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .top{background:rgba(234,241,251,.7)}
.iconbtn,.btn,.row,.stat,.setc,.tbl,.fcard,.opt,select,input[type=search],textarea,.ex{backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.row,.stat,.setc,.tbl{border-radius:20px;box-shadow:0 8px 24px -16px rgba(0,0,0,.5)}
.row{padding:14px 16px}
.row .n{border-radius:12px;background:var(--surface2)}

/* barre du bas : pilule flottante en verre */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:30px;padding:6px;background:rgba(18,30,56,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 34px -14px rgba(0,0,0,.8);max-width:720px;margin:0 auto}
:root[data-theme="light"] nav.tabs{background:rgba(255,255,255,.8)}

.pill{display:flex;align-items:center;gap:10px;margin:calc(12px + env(safe-area-inset-top,0px)) 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:28px;background:var(--surface);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bdg{font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface2);border:1px solid var(--line)}
.bdg.hb{background:rgba(74,144,226,.25);border-color:rgba(74,144,226,.6)}.bdg.sn{background:rgba(31,161,122,.25);border-color:rgba(31,161,122,.6)}
.keyf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.keyf div{background:var(--surface2);border-radius:14px;padding:8px 10px;min-width:0}
.keyf small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
.keyf b{display:block;font-size:.98rem;color:var(--de);overflow-wrap:anywhere;font-weight:700}
.tn{border:1px solid var(--line);background:var(--surface);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:20px;margin:10px 0;overflow:hidden}
.tn summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.tn summary::-webkit-details-marker{display:none}
.tn summary::after{content:"\203A";margin-left:auto;font-size:1.5rem;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.tn[open] summary::after{transform:rotate(-90deg)}
.tn .tname{font-family:var(--f-display);font-weight:700;font-size:1.05rem}.tn .tfr{color:var(--muted);font-size:.85rem}
.tn summary .spk{width:32px;height:32px;font-size:.9rem;margin-left:auto}
.tn summary .spk+*{margin-left:0}
.tn .tuse{padding:0 14px 6px;color:var(--muted);font-size:.85rem}
.frow{display:flex;align-items:baseline;gap:12px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.frow .pr{flex:none;width:84px;color:var(--muted);font-size:.92rem}
.frow .fm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:1.08rem}
.frow .fm .v{color:var(--de);font-weight:700}.frow .fm .x{color:var(--ink);opacity:.75}.frow .fm .x2{color:var(--frc);font-weight:600}
.frow .sp{flex:none;opacity:.5;font-size:.85rem}
.vtbl{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--surface);margin:10px 0;-webkit-overflow-scrolling:touch}
.vtbl table{min-width:760px}.vtbl td,.vtbl th{min-width:112px}
.vtbl td:first-child,.vtbl th:first-child{position:sticky;left:0;z-index:1;background:var(--solid);min-width:96px;font-weight:700}
.vtbl td .v{color:var(--de);font-weight:700}.vtbl td .x{opacity:.8}
.note{border-left:4px solid var(--gold);background:rgba(245,197,24,.10);border-radius:0 14px 14px 0;padding:10px 12px;margin:10px 0;font-size:.95rem}
/* guide */
.gintro{border:1px solid rgba(74,144,226,.5);background:linear-gradient(135deg,rgba(74,144,226,.22),rgba(31,161,122,.12));border-radius:22px;padding:16px;margin:12px 0}
.gintro h2{font-size:1.2rem;margin-bottom:8px}
.gintro ol{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.gsec{border:1px solid var(--line);background:var(--surface);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:20px;margin:10px 0;overflow:hidden}
.gsec summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.02rem;min-height:56px}
.gsec summary::-webkit-details-marker{display:none}
.gsec summary::after{content:"\203A";margin-left:auto;font-size:1.5rem;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.gsec[open] summary::after{transform:rotate(-90deg)}
.gsec .gn{flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#4a90e2,#2f6fd0);color:#fff;display:grid;place-items:center;font-size:.9rem}
.gsec .gb{padding:2px 14px 14px}.gsec .gb p{margin:8px 0}.gsec .gb ul{padding-left:1.1em;margin:8px 0;display:flex;flex-direction:column;gap:6px}

.more{width:100%;margin-top:10px}
.tn summary>span:first-child{flex:1;min-width:0}
.tn summary .spk{margin-left:0;flex:none}
.tn summary::after{margin-left:0}
.vtbl td .x2{color:var(--frc);font-weight:600}

.gsec .gb td,.gsec .gb th{min-width:104px}

</style>

<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
<div id="toastbox"></div>

<script>
(function(){
'use strict';
/* ---------- storage ---------- */
var KEY='de0b2:v1';
var S={done:{},cards:{},quiz:{},last:null,days:{},dir:'de',mode:'c',set:{},vfav:{},vseen:{},vrecent:[],vview:'t'};
var DEF={theme:'dark',fs:100,lh:1.5,rate:.9,hide:false,newc:20,qn:10};
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) S[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function G(k){var v=S.set&&S.set[k];return v===undefined?DEF[k]:v;}
function applySettings(){
  var r=document.documentElement,t=G('theme');
  if(t==='auto'){try{t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){t='dark';}}
  r.setAttribute('data-theme',t);
  r.style.setProperty('--root',G('fs')+'%');r.style.setProperty('--lh',G('lh'));
}
function today(){return new Date().toISOString().slice(0,10);}
function touchDay(){S.days[today()]=1;save();}
function streak(){var n=0,d=new Date();for(;;){var k=d.toISOString().slice(0,10);if(S.days[k]){n++;d.setDate(d.getDate()-1);}else if(n===0&&k===today()){d.setDate(d.getDate()-1);}else break;}return n;}

/* ---------- data ---------- */
var META=[],CATS={},LES={},LESMETA={},ORDER=[],ORD={c:[],d:[]};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fold(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json();});}
function loadMeta(){
  return getJSON('data/meta.json').then(function(m){
    META=m;
    m.forEach(function(c){c.lessons.forEach(function(l){l.cat=c.id;l.catname=c.name;l.k=c.k;LESMETA[l.id]=l;ORDER.push(l.id);ORD[c.k].push(l.id);});});
  });
}
var loading={};
function loadCat(id){
  if(CATS[id])return Promise.resolve();
  if(loading[id])return loading[id];
  loading[id]=getJSON('data/c'+(id<10?'0':'')+id+'.json').then(function(d){CATS[id]=1;for(var k in d)LES[k]=d[k];});
  return loading[id];
}
function loadAll(){return Promise.all(META.map(function(c){return loadCat(c.id);}));}

/* ---------- speech ---------- */
var voice=null;
function pickVoice(){try{var vs=speechSynthesis.getVoices();voice=vs.filter(function(v){return /^de/i.test(v.lang);})[0]||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(t){
  try{
    if(!('speechSynthesis' in window))throw 0;
    pickVoice();
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t).replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\//g,', '));
    u.lang='de-DE';u.rate=G('rate');if(voice)u.voice=voice;
    speechSynthesis.speak(u);
    if(!voice)toast('Aucune voix allemande détectée : installez-en une dans les réglages du téléphone.');
  }catch(e){toast('La lecture audio n’est pas disponible sur cet appareil.');}
}
var tt;function toast(m){var b=document.getElementById('toastbox');b.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(function(){b.innerHTML='';},3200);}

/* ---------- state / routing ---------- */
var V={name:'home'};
var nav=[];
function go(v,push){if(push!==false){V.sy=window.scrollY;nav.push(V);}V=v;render();window.scrollTo(0,0);}
function back(){var p=nav.pop();V=p||{name:'home'};render();var y=V.sy||0;window.scrollTo(0,y);setTimeout(function(){window.scrollTo(0,y)},60);}
function tab(n){nav=[];V={name:n};render();window.scrollTo(0,0);}

var ICONS={
  home:'<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
  cards:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>',
  quiz:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .8-1 1.7M12 17h.01"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  prog:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
var TABS=[['home','Accueil'],['cards','Cartes'],['quiz','Quiz'],['search','Recherche'],['prog','Progrès'],['set','Réglages']];
function section(){var n=V.name;return(n==='cat'||n==='lesson'||n==='vguide'||n==='vgroup'||n==='verb')?'home':n;}
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(section()===t[0]?' aria-current="true"':'')+'>'+ICONS[t[0]]+'<span>'+t[1]+'</span></button>';}).join('');
}

/* ---------- helpers ---------- */
function doneCount(c){return c.lessons.filter(function(l){return S.done[l.id];}).length;}
function totalDone(){return Object.keys(S.done).length;}
function ckey(de){var h=5381;for(var i=0;i<de.length;i++)h=((h<<5)+h+de.charCodeAt(i))|0;return (h>>>0).toString(36);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var DEH={'allemand':1,'deutsch':1,'exemple allemand':1,'expression':1,'verbe':1,'mot':1,'phrase allemande':1,'vocabulaire':1,'infinitif':1};
function rich(t){return esc(t).replace(/\u27e6/g,'<span class="de2">').replace(/\u27e7/g,'</span>');}
function plain(t){return String(t).replace(/[\u27e6\u27e7]/g,'');}
function speakBtn(t){return '<button class="spk" data-speak="'+esc(t)+'" aria-label="Écouter">&#128266;</button>';}

/* ---------- views ---------- */
var app=document.getElementById('app');
function render(){
  if(typeof clearFind==='function'&&V.name!=='lesson'){var fb=document.getElementById('fbar');if(fb)fb.remove();}
  renderTabs();
  var f={home:vHome,cat:vCat,lesson:vLesson,cards:vCards,quiz:vQuiz,search:vSearch,prog:vProg,set:vSet,vguide:vGuide,vgroup:vGroup,verb:vVerb}[V.name]||vHome;
  f();
}

function modeCats(k){return META.filter(function(c){return c.k===k;});}
function learned(){var n=0;for(var k in S.cards)if(S.cards[k].b>=3)n++;return n;}

function vCat(){
  var c=META.filter(function(x){return x.id===V.id;})[0];
  var h='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(c.name)+'</h1></div><div class="list">';
  c.lessons.forEach(function(l,i){
    h+='<button class="row'+(S.done[l.id]?' done':'')+'" data-lesson="'+l.id+'"><span class="n">'+(S.done[l.id]?'&#10003;':(i+1))+'</span><span class="t"><b>'+esc(l.title)+'</b><small>'+(l.nc?l.nc+' cartes':'')+(l.nc&&l.nq?' · ':'')+(l.nq?l.nq+' questions':'')+(!l.nc&&!l.nq?(l.k==='d'?'Chapitre de lecture':'Fiche de lecture'):'')+'</small></span><span class="chev">&rsaquo;</span></button>';});
  app.innerHTML=h+'</div>';
}

function vLesson(){
  var m=LESMETA[V.id];
  app.innerHTML='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(m.catname)+'</h1></div><div class="spin">Chargement…</div>';
  loadCat(m.cat).then(function(){
    if(V.name!=='lesson'||V.id!==m.id)return;
    S.last=m.id;touchDay();
    var L=LES[m.id];
    var h='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(m.catname)+'</h1><button class="iconbtn'+(S.done[m.id]?' on':'')+'" data-done="'+m.id+'" aria-label="Marquer comme terminée" aria-pressed="'+(!!S.done[m.id])+'">&#10003;</button></div>';
    h+='<article class="lesson"><div class="crumb">'+(m.k==='c'?'Fiche ':'Chapitre ')+(ORD[m.k].indexOf(m.id)+1)+' sur '+ORD[m.k].length+'</div><h1 class="ltitle">'+esc(m.title)+'</h1><div class="legend"><span class="de">Allemand</span><span class="frc">Français</span></div>';
    h+='<div class="actions">'+(L.c.length?'<button class="btn" data-lcards="'+m.id+'">Cartes ('+L.c.length+')</button>':'')+(L.q.length?'<button class="btn pri" data-lquiz="'+m.id+'">Quiz ('+L.q.length+')</button>':'')+'</div>';
    h+=blocks(L.b);
    var O=ORD[m.k],i=O.indexOf(m.id),pv=LESMETA[O[i-1]],nx=LESMETA[O[i+1]];
    h+='<div class="actions"><button class="btn wide'+(S.done[m.id]?' good':' pri')+'" data-done="'+m.id+'">'+(S.done[m.id]?'Leçon terminée ✓':'Marquer comme terminée')+'</button></div>';
    h+='<div class="pager">'+(pv?'<button class="btn" data-lesson="'+pv.id+'" data-replace="1"><small>&larr; Précédente</small>'+esc(pv.title)+'</button>':'')+(nx?'<button class="btn" data-lesson="'+nx.id+'" data-replace="1"><small>Suivante &rarr;</small>'+esc(nx.title)+'</button>':'')+'</div></article>';
    app.innerHTML=h;
    if(V.find)findInLesson(V.find);
  }).catch(function(){app.innerHTML+='<div class="empty">Impossible de charger la leçon. Vérifiez la connexion.</div>';});
}

function blocks(bs){
  var h='',inList=false;
  function closeList(){if(inList){h+='</ul>';inList=false;}}
  bs.forEach(function(b){
    if(b.t!=='li')closeList();
    switch(b.t){
      case 'h1':case 'h':h+='<h2>'+esc(b.x)+'</h2>';break;
      case 'h3':h+='<h3>'+esc(b.x)+'</h3>';break;
      case 'p':h+='<p>'+rich(b.x)+'</p>';break;
      case 'li':if(!inList){h+='<ul>';inList=true;}h+='<li'+(b.n?' class="num" data-n="'+esc(b.n)+'."':'')+'><span>'+rich(b.x)+'</span></li>';break;
      case 'kv':h+='<div class="kv"><b>'+esc(b.k)+'</b>'+rich(b.x)+'</div>';break;
      case 'ex':h+='<div class="ex'+(G('hide')?' hidefr':'')+'"><div class="tx"><span class="de">'+esc(b.de)+'</span>'+(b.fr?'<span class="fr">'+esc(b.fr)+'</span>':'')+'</div>'+speakBtn(b.de)+'</div>';break;
      case 'tbl':h+=tbl(b.rows);break;
    }
  });
  closeList();return h;
}
function colKind(c){var f=fold(c);
  if(/francais|traduction|sens|signification|bedeutung/.test(f)&&!/exemple allemand/.test(f))return 'fr';
  if(/allemand|deutsch|infinitif|exemple|expression|verbe|^mot|phrase|forme|nominativ|akkusativ|dativ|genitiv|substantif/.test(f))return 'de';
  return '';}
function tbl(rows){
  var head=rows[0],kind=head.map(colKind);
  var h='<div class="tbl"><table><thead><tr>'+head.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  rows.slice(1).forEach(function(r){h+='<tr>'+r.map(function(c,i){
    if(kind[i]==='de'&&c)return '<td class="de" data-speak="'+esc(c)+'">'+esc(c)+'</td>';
    if(kind[i]==='fr'&&c)return '<td class="frc">'+esc(c)+'</td>';
    return '<td>'+rich(c)+'</td>';}).join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

/* ---------- scope picker ---------- */
function scopeSel(cur,which){
  var o='<option value="all"'+(cur==='all'?' selected':'')+'>Tout (cours + dictionnaire)</option><option value="kc"'+(cur==='kc'?' selected':'')+'>Tout le cours</option><option value="kd"'+(cur==='kd'?' selected':'')+'>Tout le dictionnaire</option>';
  ['c','d'].forEach(function(k){o+='<optgroup label="'+(k==='c'?'Cours':'Dictionnaire')+'">';modeCats(k).forEach(function(c){o+='<option value="c'+c.id+'"'+(cur==='c'+c.id?' selected':'')+'>'+(k==='c'?c.id+'. ':'')+esc(c.name)+'</option>';});o+='</optgroup>';});
  o+='<optgroup label="Verbes"><option value="kv"'+(cur==='kv'?' selected':'')+'>Tous les verbes</option>'+VGROUPS.map(function(g){return '<option value="vg-'+g[0]+'"'+(cur==='vg-'+g[0]?' selected':'')+'>'+esc(g[1])+'</option>';}).join('')+'</optgroup>';
  if(cur&&cur.indexOf('vv-')===0&&VERBS&&VERBS[+cur.slice(3)])o='<option value="'+cur+'" selected>Verbe : '+esc(VERBS[+cur.slice(3)].i)+'</option>'+o;
  if(cur&&LESMETA[cur]){var m=LESMETA[cur];o='<option value="'+cur+'" selected>Leçon : '+esc(m.title)+'</option>'+o;}
  return '<div class="scope"><select id="scopesel" data-scope="'+which+'" aria-label="Choisir le contenu">'+o+'</select></div>';
}
function poolFor(scope){
  if(scope==='kv'||scope.indexOf('vg-')===0||scope.indexOf('vv-')===0)return loadVerbs().then(function(){return [vpoolFor(scope)];});
  var ids,need;
  if(scope==='all'||scope==='kc'||scope==='kd'){ids=scope==='all'?ORDER:scope==='kc'?ORD.c:ORD.d;
    need=scope==='all'?loadAll():Promise.all(modeCats(scope==='kc'?'c':'d').map(function(c){return loadCat(c.id);}));}
  else if(!LESMETA[scope]){var cid=+scope.slice(1);ids=META.filter(function(c){return c.id===cid;})[0].lessons.map(function(l){return l.id;});need=loadCat(cid);}
  else{ids=[scope];need=loadCat(LESMETA[scope].cat);}
  return need.then(function(){return ids.filter(function(i){return LES[i];}).map(function(i){return LES[i];});});
}

/* ---------- flashcards ---------- */
var FC={scope:'all',queue:[],i:0,flip:false,total:0,known:0};
var INT=[0,1,2,4,8,16,32];
function vCards(){
  if(!FC.started){
    app.innerHTML='<div class="top"><h1>Cartes de vocabulaire</h1><button class="iconbtn" data-dir aria-label="Sens des cartes">'+(S.dir==='de'?'DE→FR':'FR→DE')+'</button></div>'+scopeSel(FC.scope,'cards')+'<div class="spin">Préparation…</div>';
    poolFor(FC.scope).then(function(P){
      if(V.name!=='cards')return;
      var all=[];P.forEach(function(l){l.c.forEach(function(c){all.push(c);});});
      var now=Date.now(),due=[],fresh=[],n=0;
      all.forEach(function(c){var s=S.cards[ckey(c[0])];if(!s)fresh.push(c);else if(s.d<=now)due.push(c);});
      FC.avail={due:due.length,fresh:fresh.length,all:all.length};
      FC.queue=shuffle(due).concat(shuffle(fresh).slice(0,Math.max(0,G('newc')-due.length))).slice(0,G('newc'));
      FC.all=all;
      FC.i=0;FC.flip=false;FC.total=FC.queue.length;FC.known=0;
      drawCards(true);
    });
  }else drawCards(false);
}
function drawCards(intro){
  var head='<div class="top"><h1>Cartes de vocabulaire</h1><button class="iconbtn" data-dir aria-label="Sens des cartes">'+(S.dir==='de'?'DE→FR':'FR→DE')+'</button></div>'+scopeSel(FC.scope,'cards');
  if(!FC.all||!FC.all.length){app.innerHTML=head+'<div class="empty">Aucune carte dans ce choix.</div>';return;}
  if(!FC.queue.length||FC.i>=FC.queue.length){

var FND={els:[],i:0};
function clearFind(){var b=document.getElementById('fbar');if(b)b.remove();document.querySelectorAll('mark.fnd').forEach(function(m){var t=document.createTextNode(m.textContent);m.parentNode.replaceChild(t,m);});FND.els=[];}
function markIn(root,terms){
  var done=[];
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentNode.closest('button,script,style,mark.fnd')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  var nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){
    var txt=n.nodeValue,f=fold(txt),ranges=[];
    terms.forEach(function(t){var p=0,i;while((i=f.indexOf(t,p))>=0){ranges.push([i,i+t.length]);p=i+t.length;}});
    if(!ranges.length)return;
    ranges.sort(function(a,b){return a[0]-b[0];});
    var m=[ranges[0]];for(var k=1;k<ranges.length;k++){var l=m[m.length-1];if(ranges[k][0]<=l[1])l[1]=Math.max(l[1],ranges[k][1]);else m.push(ranges[k]);}
    var frag=document.createDocumentFragment(),pos=0;
    m.forEach(function(r){if(r[0]>pos)frag.appendChild(document.createTextNode(txt.slice(pos,r[0])));var mk=document.createElement('mark');mk.className='fnd';mk.textContent=txt.slice(r[0],r[1]);frag.appendChild(mk);done.push(mk);pos=r[1];});
    if(pos<txt.length)frag.appendChild(document.createTextNode(txt.slice(pos)));
    n.parentNode.replaceChild(frag,n);
  });
  return done;
}
function findInLesson(q){
  clearFind();
  var art=document.querySelector('article.lesson');if(!art||!q)return;
  var body=art.querySelectorAll('h2,h3,p,ul,.kv,.ex,table,.tblw');
  var f=fold(q).trim(),noart=f.replace(/^(der|die|das|ein|eine|to|se|sich) /,'');
  var tries=[[f],[noart],fold(q).split(/\s+/).filter(function(t){return t.length>2;})];
  var els=[];
  for(var a=0;a<tries.length&&!els.length;a++){if(!tries[a].length||(a===1&&noart===f))continue;
    // essaie d'abord avec tout le texte, sinon mot par mot
    els=markIn(art,tries[a]);
    if(els.length&&a===2){/* plusieurs mots : ok */}
  }
  var bar=document.createElement('div');bar.id='fbar';
  bar.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;max-width:704px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:.9rem';
  if(!els.length){
    bar.innerHTML='<span style="flex:1">« '+esc(q)+' » : pas retrouvé dans le texte de cette fiche (il peut se trouver dans les cartes).</span><button class="iconbtn" data-fclose aria-label="Fermer">&times;</button>';
    document.body.appendChild(bar);return;
  }
  FND.els=els;FND.i=0;
  bar.innerHTML='<span style="flex:1;min-width:0"><b id="fcnt"></b> · « '+esc(q)+' »</span><button class="iconbtn" data-fprev aria-label="Précédent">&uarr;</button><button class="iconbtn" data-fnext aria-label="Suivant">&darr;</button><button class="iconbtn" data-fclose aria-label="Fermer">&times;</button>';
  document.body.appendChild(bar);
  showFind(0);
}
function showFind(i){
  var n=FND.els.length;if(!n)return;FND.i=(i+n)%n;
  FND.els.forEach(function(m,k){m.classList.toggle('cur',k===FND.i);});
  var c=document.getElementById('fcnt');if(c)c.textContent=(FND.i+1)+' / '+n;
  var m=FND.els[FND.i];m.scrollIntoView({block:'center',behavior:'smooth'});
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-fclose],[data-fprev],[data-fnext]');if(!b)return;
  e.stopPropagation();
  if(b.hasAttribute('data-fclose'))return clearFind();
  showFind(FND.i+(b.hasAttribute('data-fnext')?1:-1));
},true);

function hl(s,toks){
  var out='',f=fold(s),mark=new Array(s.length).fill(false);
  toks.forEach(function(t){var p=0,i;while((i=f.indexOf(t,p))>=0){for(var k=i;k<i+t.length&&k<s.length;k++)mark[k]=true;p=i+t.length;}});
  var open=false;
  for(var k=0;k<s.length;k++){if(mark[k]&&!open){out+='<span class="hl">';open=true;}if(!mark[k]&&open){out+='</span>';open=false;}out+=esc(s[k]);}
  if(open)out+='</span>';return out;
}
function doSearch(){
  var res=document.getElementById('res');if(!res||!SIX)return;
  var toks=fold(SQ).split(/\s+/).filter(function(t){return t.length>0;});
  if(!toks.length){res.innerHTML='<div class="empty">Tapez un mot allemand ou français pour le retrouver dans le cours, le dictionnaire et les verbes.</div>';return;}
  var wh=[];
  if(DICT){
    var q=toks.join(' ');
    DICT.forEach(function(w){var sc=-1;
      if(w.fd===q||w.fd.replace(/^(der|die|das) /,'')===q)sc=0;
      else if(w.ff===q)sc=1;
      else if(toks.every(function(t){return w.fd.indexOf(t)>=0;}))sc=2;
      else if(toks.every(function(t){return w.ff.indexOf(t)>=0;}))sc=3;
      if(sc>=0)wh.push({w:w,sc:sc});});
    wh.sort(function(a,b){return a.sc-b.sc||a.w.de.length-b.w.de.length;});
  }
  var vm=VERBS?vsearchAll(toks):[];
  var hits=[];
  SIX.forEach(function(e){
    var tm=toks.every(function(t){return e.ft.indexOf(t)>=0;});
    var best=-1;
    for(var i=0;i<e.fl.length;i++){if(toks.every(function(t){return e.fl[i].indexOf(t)>=0;})){best=i;break;}}
    if(best<0&&!tm){var all=e.fl.join(' ');if(!toks.every(function(t){return all.indexOf(t)>=0;}))return;}
    hits.push({e:e,tm:tm,line:best});
  });
  hits.sort(function(a,b){return (b.tm-a.tm)||((b.line>=0)-(a.line>=0));});
  var h='';
  if(vm.length){h+='<div class="sec">Verbes · '+vm.length+(vm.length>15?' (15 premiers)':'')+'</div><div class="list">'+vm.slice(0,15).map(vhitRow).join('')+'</div>';}
  if(wh.length){h+='<div class="sec">Mots du dictionnaire · '+wh.length+(wh.length>25?' (25 premiers)':'')+'</div><div class="list">';
    wh.slice(0,25).forEach(function(x){h+='<div class="row"><span class="t" data-lesson="'+x.w.l+'" data-find="'+esc(x.w.de)+'" style="cursor:pointer"><b class="de">'+hl(x.w.de,toks)+'</b><div class="frc">'+hl(x.w.fr,toks)+'</div><button class="snip" style="background:none;border:0;padding:0;text-align:left;text-decoration:underline" data-lesson="'+x.w.l+'" data-find="'+esc(x.w.de)+'">📍 '+esc(LESMETA[x.w.l].title)+'</button></span><button class="spk" data-speak="'+esc(x.w.de)+'" aria-label="Écouter">&#128266;</button></div>';});
    h+='</div>';}
  h+='<div class="sec">Fiches · '+hits.length+' résultat'+(hits.length>1?'s':'')+(hits.length>40?' (40 premiers)':'')+'</div><div class="list">';
  hits.slice(0,40).forEach(function(x){
    var sn=x.line>=0?x.e.lines[x.line]:'';
    if(sn.length>150)sn=sn.slice(0,150)+'…';
    h+='<button class="row" data-lesson="'+x.e.id+'" data-find="'+esc(SQ.trim())+'"><span class="t"><b>'+hl(x.e.title,toks)+'</b>'+(sn?'<div class="snip">'+hl(sn,toks)+'</div>':'')+'<small>'+esc(LESMETA[x.e.id].catname)+'</small></span><span class="chev">&rsaquo;</span></button>';});
  res.innerHTML=h+'</div>';

  var t=e.target.closest('[data-tab],[data-cat],[data-lesson],[data-back],[data-done],[data-speak],[data-lcards],[data-lquiz],[data-flip],[data-grade],[data-dir],[data-cardsgo],[data-qstart],[data-qquit],[data-opt],[data-qnext],[data-reset],[data-mode],[data-copy],[data-set],[data-backup],[data-setreset],[data-copy],.ex.hidefr');
  if(!t)return;
  var d=t.dataset;
  if(t.classList.contains('hidefr')&&!e.target.closest('.spk')){t.classList.toggle('show');return;}
  if(d.set){var v=d.v;if(d.set==='dirx'){S.dir=v;save();return render();}
    if(v==='true')v=true;else if(v==='false')v=false;else if(!isNaN(+v))v=+v;
    S.set[d.set]=v;save();applySettings();return render();}
  if(d.copy){try{navigator.clipboard.writeText(d.copy).then(function(){toast('Copié');},function(){toast(d.copy);});}catch(er){toast(d.copy);}return;}
  if(d.setreset){S.set={};save();applySettings();toast('Réglages rétablis');return render();}
  if(d.backup==='copy'){var txt=JSON.stringify({v:1,done:S.done,cards:S.cards,quiz:S.quiz,days:S.days,last:S.last,set:S.set,vfav:S.vfav,vseen:S.vseen,vrecent:S.vrecent,vview:S.vview});
    var ta=document.getElementById('bk');ta.value=txt;ta.focus();ta.select();
    try{navigator.clipboard.writeText(txt).then(function(){toast('Sauvegarde copiée');},function(){toast('Texte sélectionné : copiez-le manuellement');});}catch(er){toast('Texte sélectionné : copiez-le manuellement');}return;}
  if(d.backup==='restore'){try{var o=JSON.parse(document.getElementById('bk').value);if(!o||o.v!==1)throw 0;['done','cards','quiz','days','last','set','vfav','vseen','vrecent','vview'].forEach(function(k){if(o[k]!==undefined)S[k]=o[k];});save();applySettings();toast('Progression restaurée');render();}catch(er){toast('Sauvegarde non valide.');}return;}
  if(d.mode){S.mode=d.mode;save();return render();}
  if(d.tab)return tab(d.tab);
  if(d.cat)return go({name:'cat',id:+d.cat});
  if(d.lesson){if(d.replace){nav.pop();return go({name:'lesson',id:d.lesson},true);}return go({name:'lesson',id:d.lesson,find:d.find||''});}
  if('back' in d)return back();
  if(d.done){var id=d.done;if(S.done[id])delete S.done[id];else{S.done[id]=1;touchDay();toast('Leçon terminée');}save();return render();}
  if(d.speak!==undefined)return speak(d.speak);
  if(d.lcards){FC.scope=d.lcards;FC.started=false;nav.push(V);V={name:'cards'};return render();}
  if(d.lquiz){Q.scope=d.lquiz;Q.running=false;nav.push(V);V={name:'quiz'};return render();}
  if('flip' in d){FC.flip=!FC.flip;return drawCards(false);}
  if(d.grade!==undefined)return grade(d.grade==='1');
  if('dir' in d){S.dir=S.dir==='de'?'fr':'de';save();return drawCards(false);}
  if(d.cardsgo){if(d.cardsgo==='force'){var all=shuffle(FC.all).slice(0,G('newc'));FC.queue=all;FC.i=0;FC.flip=false;FC.total=all.length;FC.known=0;FC.started=true;return drawCards(false);}FC.started=false;return vCards();}
  if(d.qstart)return qStart();
  if('qquit' in d){Q.running=false;if(nav.length&&/^(lesson|verb|vgroup)$/.test(nav[nav.length-1].name))return back();return vQuiz();}
  if(d.opt!==undefined&&Q.answered<0){Q.answered=+d.opt;if(Q.opts[Q.answered].c)Q.score++;return drawQuiz();}
  if(d.qnext){Q.i++;Q.answered=-1;Q.opts=null;return drawQuiz();}
  if(d.reset){S.done={};S.cards={};S.quiz={};S.days={};S.last=null;S.vfav={};S.vseen={};S.vrecent=[];save();toast('Progression effacée');return render();}
});

  else{Q.scope=s.value;Q.running=false;vQuiz();}

/* ====================== RUBRIQUE VERBES ====================== */
var VERBS=null,vload=null;
var VGROUPS=[
 ['aux','Auxiliaires','haben, sein, werden et la tournure passive geboren werden'],
 ['faible','Verbes faibles / réguliers','Prétérit en -te, participe ge-…-t : les plus faciles'],
 ['fort','Verbes forts / irréguliers','La voyelle du radical change ; participe en -en'],
 ['mixte','Verbes mixtes','Voyelle qui change, mais terminaisons faibles (-te, -t)'],
 ['modal','Verbes modaux','können, müssen, dürfen, wollen, sollen, mögen…'],
 ['sep','Verbes à particule séparable','aufstehen, anrufen… la particule part en fin de phrase'],
 ['insep','Verbes à préfixe inséparable','be-, ent-, er-, ver-, zer-… jamais séparés, participe sans ge-'],
 ['pron','Verbes pronominaux (réfléchis)','sich waschen, sich freuen… avec le pronom réfléchi']
];
var VGN={};VGROUPS.forEach(function(g){VGN[g[0]]=g;});
var PERS=['ich','du','er/sie/es','wir','ihr','sie/Sie'];
var PSAY=['ich','du','er','wir','ihr','sie'];
var TN=[
 ['Präsens','présent','Ce qui se passe maintenant, une habitude, un futur proche.'],
 ['Präteritum','prétérit','Récit au passé, surtout à l’écrit ; courant à l’oral pour sein, haben et les modaux.'],
 ['Perfekt','passé composé','Le passé de la conversation : haben ou sein + participe II.'],
 ['Plusquamperfekt','plus-que-parfait','Une action passée, antérieure à une autre action passée.'],
 ['Futur I','futur','Le futur, une promesse, une supposition : werden + infinitif.'],
 ['Futur II','futur antérieur','Action terminée dans le futur, ou supposition sur le passé.']
];
function vkey(inf){return fold(inf).replace(/^sich /,'');}
function loadVerbs(){
  if(VERBS)return Promise.resolve();
  if(vload)return vload;
  vload=getJSON('data/verbs.json').then(function(d){
    var a=d.map(function(x){return{i:x[0],f:x[1],s:x[2],c:x[3],a:x[4],p:x[5],t:x.slice(6).map(function(r){return r.split('|');}),k:vkey(x[0]),fi:fold(x[0]),ff:fold(x[1])};});
    a.sort(function(p,q){return p.k<q.k?-1:p.k>q.k?1:p.i<q.i?-1:1;});
    a.forEach(function(v,n){v.n=n;});
    VERBS=a;
  });
  return vload;
}
function vSay(pi,f){return PSAY[pi]+' '+f;}
function fmtForm(f,ti){
  var i=f.indexOf(' ');
  if(i<0)return '<span class="v">'+esc(f)+'</span>';

  return '<span class="x">'+esc(a)+'</span> <span class="x2">'+esc(r)+'</span>';
}
function vParts(v){return v.t[0][2]+' · '+v.t[1][2]+' · '+v.t[2][2];}
function vrow(v){

function vsearchAll(toks){
  var qq=toks.join(' '),res=[];
  VERBS.forEach(function(v){
    var sc=-1,fm='';
    if(v.k===qq||v.fi===qq)sc=0;
    else if(toks.every(function(t){return v.fi.indexOf(t)>=0;}))sc=1;
    else if(toks.every(function(t){return v.ff.indexOf(t)>=0;}))sc=2;
    else if(qq.length>=3){
      if(!v.fa)v.fa=fold(v.t.map(function(r){return r.join('|');}).join('|'));
      if(v.fa.indexOf(qq)>=0){
        sc=3;
        outer:for(var ti=0;ti<6;ti++)for(var pi=0;pi<6;pi++){if(fold(v.t[ti][pi]).indexOf(qq)>=0){fm=TN[ti][0]+' · '+PSAY[pi]+' '+v.t[ti][pi];break outer;}}
      }
    }
    if(sc>=0)res.push({v:v,sc:sc,fm:fm});
  });
  res.sort(function(a,b){return a.sc-b.sc||a.v.k.length-b.v.k.length;});
  return res;
}

}

/* ---------- liste d’un groupe (A–Z, filtre) ---------- */
function vBase(sec){
  if(sec==='all')return VERBS;
  if(sec==='fav')return VERBS.filter(function(v){return S.vfav[v.i];});
  return VERBS.filter(function(v){return v.s===sec;});
}
function vGroup(){
  var sec=V.sec,title=sec==='all'?'Tous les verbes':sec==='fav'?'Mes favoris':VGN[sec][1];
  var top='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(title)+'</h1></div>';
  app.innerHTML=top+'<div class="spin">Chargement…</div>';
  loadVerbs().then(function(){
    if(V.name!=='vgroup'||V.sec!==sec)return;
    var h=top;
    if(sec!=='all'&&sec!=='fav')h+='<p style="color:var(--muted);margin:10px 0 0">'+esc(VGN[sec][2])+'</p>';
    h+='<div class="vsearch"><input type="search" id="vgq" placeholder="Filtrer cette liste…" value="'+esc(V.q||'')+'" autocomplete="off" aria-label="Filtrer"></div><div class="chips" id="vlet"></div><div class="prog"><span id="vcnt"></span><span></span></div><div class="list" id="vlist"></div><div id="vmore"></div>';
    h+='<div class="actions" style="margin-top:16px"><button class="btn" data-vgcards="'+(sec==='all'?'kv':'vg-'+sec)+'">Cartes de ce groupe</button><button class="btn pri" data-vgquiz="'+(sec==='all'?'kv':'vg-'+sec)+'">Quiz de conjugaison</button></div>';
    app.innerHTML=h;drawVList();
  });
}
function drawVList(){
  var lst=document.getElementById('vlist');if(!lst||!VERBS)return;
  var toks=fold(V.q||'').split(/\s+/).filter(Boolean),base=vBase(V.sec);
  if(toks.length)base=base.filter(function(v){return toks.every(function(t){return v.fi.indexOf(t)>=0||v.ff.indexOf(t)>=0;});});
  var set={};base.forEach(function(v){var c=v.k.charAt(0).toUpperCase();set[/[A-Z]/.test(c)?c:'#']=1;});
  var letters=Object.keys(set).sort();
  var arr=V.letter?base.filter(function(v){var c=v.k.charAt(0).toUpperCase();return (/[A-Z]/.test(c)?c:'#')===V.letter;}):base;
  document.getElementById('vlet').innerHTML=letters.length>1?'<button class="chip" data-vletter="" aria-pressed="'+(!V.letter)+'">Tous</button>'+letters.map(function(c){return '<button class="chip" data-vletter="'+c+'" aria-pressed="'+(V.letter===c)+'">'+c+'</button>';}).join(''):'';
  document.getElementById('vcnt').textContent=arr.length+' verbe'+(arr.length>1?'s':'');
  var lim=V.lim||60;
  lst.innerHTML=arr.length?arr.slice(0,lim).map(vrow).join(''):'<div class="empty">'+(V.sec==='fav'&&!toks.length?'Aucun favori pour l’instant. Touchez l’étoile ☆ sur la fiche d’un verbe pour l’ajouter ici.':'Aucun verbe trouvé.')+'</div>';
  document.getElementById('vmore').innerHTML=arr.length>lim?'<button class="btn more" data-vmore="1">Afficher plus ('+(arr.length-lim)+' restants)</button>':'';
}

/* ---------- fiche d’un verbe ---------- */
function vVerb(){
  var top0='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>Verbe</h1></div>';
  app.innerHTML=top0+'<div class="spin">Chargement…</div>';
  loadVerbs().then(function(){
    if(V.name!=='verb')return;
    var v=VERBS[V.n];
    if(!v){app.innerHTML=top0+'<div class="empty">Verbe introuvable.</div>';return;}
    S.vseen[v.i]=1;S.vrecent=[v.i].concat((S.vrecent||[]).filter(function(x){return x!==v.i;})).slice(0,12);touchDay();
    var fav=!!S.vfav[v.i],h='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(v.i)+'</h1><button class="iconbtn'+(fav?' on':'')+'" data-vfav="'+v.n+'" aria-label="Favori" style="font-size:1.3rem">'+(fav?'★':'☆')+'</button></div>';
    h+='<div class="vhead"><div class="inf">'+esc(v.i)+'</div><div class="fr2">'+esc(v.f)+'</div><div class="badges"><span class="bdg">'+esc(v.c)+'</span><span class="bdg '+(v.a==='sein'?'sn':'hb')+'">Perfekt avec '+esc(v.a)+'</span><span class="bdg">Partizip II : '+esc(v.p)+'</span></div>';
    h+='<div class="keyf"><div><small>Präsens er/sie/es</small><b>'+esc(v.t[0][2])+'</b></div><div><small>Präteritum er/sie/es</small><b>'+esc(v.t[1][2])+'</b></div><div><small>Perfekt er/sie/es</small><b>'+esc(v.t[2][2])+'</b></div></div>';
    h+='<div class="actions"><button class="btn" data-speak="'+esc(v.i)+'">&#128266; Écouter</button><button class="btn pri" data-vquiz="'+v.n+'">Quiz sur ce verbe</button></div></div>';
    var notes=[],m=/séparable \(([^)]+)\)/.exec(v.c);

    if(v.s==='insep'||v.c.indexOf('inséparable')>=0)notes.push('Préfixe inséparable : il ne se détache jamais et le participe II ne prend pas de <b class="de">ge-</b>.');
    if(v.s==='pron'||v.c.indexOf('réfléchi')>=0)notes.push('Verbe pronominal : le pronom réfléchi se conjugue avec le verbe (<b class="de">ich … mich</b>, <b class="de">du … dich</b>).');
    if(v.a==='sein')notes.push('Ce verbe forme son passé composé et son plus-que-parfait avec <b class="de">sein</b>.');

}

/* ---------- conjugaison : questions de quiz et cartes ---------- */
function vQ(v,ti,pi){
  if(ti===undefined)ti=Math.floor(Math.random()*6);
  if(pi===undefined)pi=Math.floor(Math.random()*6);
  var ok=v.t[ti][pi],pool=[];
  v.t[ti].forEach(function(f,i){if(i!==pi&&f!==ok&&pool.indexOf(f)<0)pool.push(f);});
  if(pool.length<3)v.t.forEach(function(r,i){if(i!==ti){var f=r[pi];if(f!==ok&&pool.indexOf(f)<0)pool.push(f);}});
  var tries=0;
  while(pool.length<3&&tries++<30){var w=VERBS[Math.floor(Math.random()*VERBS.length)],f=w.t[ti][pi];if(f!==ok&&pool.indexOf(f)<0)pool.push(f);}
  var o=shuffle(shuffle(pool).slice(0,3).concat([ok]));
  return{t:'cj',q:v.i+' — '+v.f,hint:TN[ti][0]+' · '+PERS[pi],o:o,a:o.indexOf(ok)};
}
function vpoolFor(scope){
  var arr,single=scope.indexOf('vv-')===0;
  if(scope==='kv')arr=VERBS;
  else if(scope.indexOf('vg-')===0)arr=VERBS.filter(function(v){return v.s===scope.slice(3);});
  else arr=[VERBS[+scope.slice(3)]];
  var qs=[];
  arr.forEach(function(v){
    if(single){for(var ti=0;ti<6;ti++)for(var pi=0;pi<6;pi++)qs.push(vQ(v,ti,pi));}
    else{qs.push(vQ(v));qs.push(vQ(v));}
  });
  return{c:arr.map(function(v){return[v.i,v.f,vParts(v)];}),q:qs};
}

function gT(head,rows,de){
  de=de||[];

}
function gE(pairs){return pairs.map(function(p){return '<div class="ex"><div class="tx"><span class="de">'+esc(p[0])+'</span><span class="fr">'+esc(p[1])+'</span></div>'+speakBtn(p[0])+'</div>';}).join('');}
function gS(n,title,body,open){return '<details class="gsec"'+(open?' open':'')+'><summary><span class="gn">'+n+'</span><span>'+title+'</span></summary><div class="gb">'+body+'</div></details>';}
function gL(names){return '<div class="vlinks">'+names.map(function(x){return '<button class="chip de" data-vname="'+esc(x)+'">'+esc(x)+'</button>';}).join('')+'</div>';}

  h+=gS(9,'Les verbes pronominaux',
   gT(['Personne','Accusatif','Datif'],[['ich','mich','mir'],['du','dich','dir'],['er/sie/es','sich','sich'],['wir','uns','uns'],['ihr','euch','euch'],['sie/Sie','sich','sich']],[1,2])+
   '<ul><li>Le pronom réfléchi suit le verbe conjugué (ou le sujet s’il est un pronom).</li><li>On emploie le <b>datif</b> quand le verbe a déjà un COD : <span class="de">Ich wasche mir die Hände.</span></li><li>Au passé composé : toujours <b class="de">haben</b>.</li></ul>'+
   gE([['Ich freue mich auf das Wochenende.','Je me réjouis du week-end qui vient.'],['Du interessierst dich für Musik.','Tu t’intéresses à la musique.'],['Wir treffen uns um acht.','Nous nous retrouvons à huit heures.'],['Ich habe mich beeilt.','Je me suis dépêché.'],['Ich putze mir die Zähne.','Je me brosse les dents.'],['Ich weiß, dass er sich beeilt.','Je sais qu’il se dépêche.']])+
   '<h4>Verbes courants avec leur préposition</h4><ul><li><span class="de">sich freuen auf</span> + A (attendre avec impatience) ; <span class="de">sich freuen über</span> + A (se réjouir de)</li><li><span class="de">sich interessieren für</span> + A ; <span class="de">sich erinnern an</span> + A ; <span class="de">sich treffen mit</span> + D</li></ul>'+gL(['sich waschen','sich freuen','sich interessieren','sich erinnern']));
  // 10
  h+=gS(10,'sein, haben, werden : les trois auxiliaires',
   gT(['Personne','sein','haben','werden'],[['ich','bin','habe','werde'],['du','bist','hast','wirst'],['er/sie/es','ist','hat','wird'],['wir','sind','haben','werden'],['ihr','seid','habt','werdet'],['sie/Sie','sind','haben','werden']],[1,2,3])+
   gT(['Personne','sein','haben','werden'],[['ich','war','hatte','wurde'],['du','warst','hattest','wurdest'],['er/sie/es','war','hatte','wurde'],['wir','waren','hatten','wurden'],['ihr','wart','hattet','wurdet'],['sie/Sie','waren','hatten','wurden'],['Partizip II','gewesen','gehabt','geworden / worden']],[1,2,3])+
   '<ul><li><b class="de">sein</b> = être : <span class="de">Ich bin müde.</span> Auxiliaire du Perfekt des verbes de mouvement et de changement d’état.</li>'+
   '<li><b class="de">haben</b> = avoir : <span class="de">Ich habe Hunger.</span> Auxiliaire du Perfekt de la plupart des verbes.</li>'+
   '<li><b class="de">werden</b> = devenir : <span class="de">Es wird kalt.</span> Auxiliaire du <b>futur</b> (<span class="de">Ich werde kommen.</span>) et du <b>passif</b> (<span class="de">Das Haus wird gebaut.</span>).</li></ul>'+
   '<div class="note">Passif au passé composé : <span class="de">Das Haus ist gebaut worden.</span> On emploie <b>worden</b> (et non <i>geworden</i>) comme auxiliaire du passif.</div>'+gL(['sein','haben','werden','geboren werden']));
  return h;
}
function vGuide(){

  app.innerHTML=top+'<div class="spin">Chargement…</div>';

    if(V.name!=='vguide')return;
    app.innerHTML=top+guideHTML();

/* ---------- événements : verbes, thème ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-themetoggle],[data-vguide],[data-vgroup],[data-vletter],[data-vmore],[data-verb],[data-vname],[data-vfav],[data-vview],[data-vtspeak],[data-vguideall],[data-vquiz],[data-vgcards],[data-vgquiz]');
  if(!t)return;
  var d=t.dataset;
  if('themetoggle' in d){var cur=document.documentElement.getAttribute('data-theme');S.set.theme=(cur==='light')?'dark':'light';save();applySettings();return render();}
  if('vguide' in d)return go({name:'vguide'});
  if(d.vgroup)return go({name:'vgroup',sec:d.vgroup,q:'',letter:'',lim:60});
  if(d.vletter!==undefined&&t.classList.contains('chip')&&t.hasAttribute('data-vletter')){V.letter=d.vletter;V.lim=60;return drawVList();}
  if('vmore' in d){V.lim=(V.lim||60)+100;return drawVList();}
  if(d.verb!==undefined){if(d.vrep){nav.pop();return go({name:'verb',n:+d.verb},true);}return go({name:'verb',n:+d.verb});}
  if(d.vname){loadVerbs().then(function(){var f=VERBS.filter(function(v){return v.i===d.vname;})[0];if(f)go({name:'verb',n:f.n});});return;}
  if(d.vfav!==undefined){loadVerbs().then(function(){var v=VERBS[+d.vfav];if(S.vfav[v.i]){delete S.vfav[v.i];t.textContent='☆';t.classList.remove('on');toast('Retiré des favoris');}else{S.vfav[v.i]=1;t.textContent='★';t.classList.add('on');toast('Ajouté aux favoris');}save();});return;}
  if(d.vview){S.vview=d.vview;save();return render();}
  if(d.vtspeak!==undefined){e.preventDefault();return speak(d.vtspeak);}
  if(d.vguideall!==undefined){var on=d.vguideall==='1';document.querySelectorAll('details.gsec').forEach(function(x){x.open=on;});return;}
  if(d.vquiz!==undefined){Q.scope='vv-'+d.vquiz;Q.running=false;nav.push(V);V={name:'quiz'};return render();}
  if(d.vgcards){FC.scope=d.vgcards;FC.started=false;nav.push(V);V={name:'cards'};return render();}
  if(d.vgquiz){Q.scope=d.vgquiz;Q.running=false;nav.push(V);V={name:'quiz'};return render();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='vq'){V.vq=e.target.value;drawVBody();}
  if(e.target.id==='vgq'){V.q=e.target.value;V.letter='';V.lim=60;drawVList();}
});

loadMeta().then(function(){render();}).catch(function(){app.innerHTML='<div class="empty">Impossible de charger le cours. Vérifiez la connexion puis rouvrez la page.</div>';});
})();
