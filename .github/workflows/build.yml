name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône et écran de démarrage
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#0a1222' --iconBackgroundColorDark '#0a1222' --splashBackgroundColor '#0a1222' --splashBackgroundColorDark '#0a1222'

      - name: Icône de l'application (image de couverture)
        run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          rm -f android/app/src/main/res/drawable*/ic_launcher_foreground.xml android/app/src/main/res/drawable*/ic_launcher_background.xml
          cp -r android-res/* android/app/src/main/res/

      - name: Autorisations Android (notifications, micro)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$P" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" "$M"
          done
          grep -n "uses-permission" "$M"

      - name: Copier l'application dans Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Allemand-0-B2.apk

      # Onglet ACTIONS > clic sur l'exécution > "Artifacts" : télécharger le zip contenant l'APK
      - name: Zip d'installation (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Allemand-0-B2-APK
          path: Allemand-0-B2.apk
          retention-days: 90

      # Copie de secours : onglet RELEASES
      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Allemand 0-B2 v${{ github.run_number }}
          files: Allemand-0-B2.apk
