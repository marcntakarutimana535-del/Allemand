<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#102344">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Allemand 0 → B2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Thème : verre sur dégradé nuit (modèle TCF Canada). Layout: mobile-first course reader. Fixed bottom tab bar (Cours, Cartes, Quiz, Recherche, Progrès); content in one column, max 720px. Palette: cool paper, petrol green accent, marker-yellow highlight for German. */

*{box-sizing:border-box}
html,body{margin:0}
html{font-size:var(--root,100%)}
body{color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:var(--lh,1.5);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 118px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:720px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;min-height:56px}
.top h1{font-size:1.15rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;padding:0 12px}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hero{padding:18px 0 8px}
.hero .kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-size:2.1rem;margin-top:4px}
.hero h1 span{background:linear-gradient(transparent 60%,var(--mark) 60%)}
.cont{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:14px 0;padding:14px 16px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink)}
.cont small{display:block;opacity:.85;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.cont b{font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.cont .arrow{margin-left:auto;font-size:1.4rem}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin:10px 0 4px}.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:42px;font-weight:600;color:var(--muted)}.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;min-width:0}
.row .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;line-height:1.25}
.row .t small{color:var(--muted);font-size:.82rem}
.row.done .n{background:var(--good);color:#fff}
.bar{height:5px;background:var(--surface2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.chev{color:var(--muted);flex:none}
.setc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;flex-direction:column;gap:8px}.crow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.crow a{color:var(--accent);font-weight:600;overflow-wrap:anywhere;min-width:0}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between}.crow span{min-width:0;overflow-wrap:anywhere;user-select:all}a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.setc small{color:var(--muted)}.setc .seg{margin:0}.setc .seg button{font-size:.88rem;padding:4px 6px;line-height:1.15}.setc input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}.fsrow{display:flex;justify-content:space-between;color:var(--muted)}.demo{margin:0;padding:10px;border-radius:10px;background:var(--surface2)}textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;min-width:0;resize:vertical}
.sec{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px}
/* lesson */
.lesson{padding-bottom:12px}
.lesson h1.ltitle{font-size:1.75rem;margin:6px 0 4px}
.lesson .crumb{color:var(--muted);font-size:.85rem}
.lesson h2{font-size:1.35rem;margin:28px 0 8px;padding-top:6px;border-top:2px solid var(--accent)}
.lesson h3{font-size:1.1rem;margin:20px 0 6px;color:var(--accent)}
.lesson p{margin:8px 0}
.lesson ul{padding:0;margin:8px 0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lesson li{display:flex;gap:10px}
.lesson li::before{content:"•";color:var(--accent);font-weight:700}
.lesson li.num::before{content:attr(data-n);min-width:1.4em;font-family:var(--f-display);font-weight:700}
.kv{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.kv b{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.ex{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:8px 10px 8px 12px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}
.ex .tx{flex:1;min-width:0}
.de{font-weight:700;color:var(--de)}.frc{color:var(--frc)}.de2{color:var(--de);font-weight:600}
.ex .fr{display:block;color:var(--frc);font-size:.92rem}
.hidefr .fr{display:none}.hidefr.show .fr{display:block}.hidefr .tx::after{content:"Touchez pour voir la traduction";display:block;font-size:.78rem;color:var(--muted)}.hidefr.show .tx::after{display:none}
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-size:1rem}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;min-width:78px}
th{background:var(--surface2);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.de{cursor:pointer}td.de::after{content:"";}.legend{display:flex;gap:14px;font-size:.85rem;margin:6px 0 0}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:currentColor}
.fcard .big.de{font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.wide{flex:1}
.pager{display:flex;gap:8px;margin:20px 0}
.pager .btn{flex:1;text-align:left;font-weight:600;line-height:1.2;min-width:0}
.pager small{display:block;color:var(--muted);font-weight:400}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);border-radius:10px;min-height:48px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
/* cards */
.scope{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;min-width:0;max-width:100%}
select{flex:1}
.fc{perspective:900px;margin:10px 0}
.fcard{min-height:240px;width:100%;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;box-shadow:0 6px 24px -14px rgba(0,0,0,.35)}
.fcard .side{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fcard .big{font-family:var(--f-display);font-size:1.7rem;line-height:1.25;overflow-wrap:anywhere}
.fcard.back{background:var(--accent-soft)}
.prog{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:6px}
/* quiz */
.q{margin:8px 0}
.q .qt{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.q .qq{font-family:var(--f-display);font-size:1.4rem;line-height:1.25;margin:6px 0 4px;overflow-wrap:anywhere}
.q .hint{color:var(--muted);font-style:italic;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:48px;line-height:1.3}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.score{text-align:center;padding:22px 10px}
.score b{display:block;font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.fnd{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px;box-shadow:0 0 0 2px var(--mark)}.fnd.cur{outline:3px solid var(--accent);outline-offset:1px;animation:fpulse 1s ease 2}@keyframes fpulse{50%{box-shadow:0 0 0 7px rgba(255,200,0,.5)}}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.snip{color:var(--muted);font-size:.9rem;margin-top:2px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw;font-size:.9rem}
.spin{padding:40px;text-align:center;color:var(--muted)}
.pbar{display:flex;flex-direction:column;gap:12px}
.pbar .l{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.pbar .l span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
@media (prefers-reduced-motion:no-preference){.fcard{transition:transform .2s}.fcard:active{transform:scale(.985)}}
/* ===== Thème « verre sur dégradé nuit » (modèle TCF Canada) ===== */
:root{
  --bg:#0c1427; --surface:rgba(255,255,255,.075); --surface2:rgba(255,255,255,.11); --ink:#EAF0FA; --muted:#A3B3CE; --line:rgba(255,255,255,.14);
  --de:#7FB6FF; --frc:#6FE3B4; --accent:#4189DE; --accent-ink:#FFFFFF; --accent-soft:rgba(65,137,222,.2); --mark:#F2B705; --mark-ink:#2B2100;
  --good:#1C916C; --good-soft:rgba(28,145,108,.25); --bad:#E0605A; --bad-soft:rgba(224,96,90,.22);
  --page:linear-gradient(180deg,#14305e 0%,#0f2142 26%,#0a2030 50%,#1b1b3e 78%,#251f4d 100%);
  --top:#102344; --navbg:rgba(59,54,97,.78); --navon:rgba(110,104,150,.55); --navink:#6FA8F0;
  --g-blue:linear-gradient(135deg,rgba(65,137,222,.34),rgba(29,69,93,.5)); --g-green:linear-gradient(135deg,rgba(28,145,108,.32),rgba(25,76,84,.5)); --g-amber:linear-gradient(135deg,rgba(242,183,5,.24),rgba(45,77,90,.5));
  --t-blue:linear-gradient(145deg,#4a93ec,#2c79d4); --t-green:linear-gradient(145deg,#27ab7f,#167356); --t-amber:linear-gradient(145deg,#f7c61a,#d39f00);
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
:root[data-theme="light"]{
  --bg:#EAF1FB; --surface:rgba(255,255,255,.78); --surface2:rgba(16,35,68,.07); --ink:#10213F; --muted:#51627F; --line:rgba(16,35,68,.13);
  --de:#1F5FBF; --frc:#137A58; --accent:#2C79D4; --accent-soft:rgba(44,121,212,.14); --mark:#F7C61A; --mark-ink:#2B2100;
  --good:#1C916C; --good-soft:rgba(28,145,108,.16); --bad:#C8453F; --bad-soft:rgba(200,69,63,.14);
  --page:linear-gradient(180deg,#DCE9FB 0%,#E6EFF8 35%,#E3F1EF 65%,#ECE8F8 100%);
  --top:#DCE9FB; --navbg:rgba(255,255,255,.82); --navon:rgba(44,121,212,.15); --navink:#2C79D4;
  --g-blue:linear-gradient(135deg,rgba(65,137,222,.2),rgba(255,255,255,.7)); --g-green:linear-gradient(135deg,rgba(28,145,108,.18),rgba(255,255,255,.7)); --g-amber:linear-gradient(135deg,rgba(242,183,5,.22),rgba(255,255,255,.7));
  --shadow:0 10px 26px -16px rgba(16,35,68,.45); color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme]){
  --bg:#EAF1FB; --surface:rgba(255,255,255,.78); --surface2:rgba(16,35,68,.07); --ink:#10213F; --muted:#51627F; --line:rgba(16,35,68,.13);
  --de:#1F5FBF; --frc:#137A58; --accent:#2C79D4; --accent-soft:rgba(44,121,212,.14); --mark:#F7C61A;
  --good-soft:rgba(28,145,108,.16); --bad:#C8453F; --bad-soft:rgba(200,69,63,.14);
  --page:linear-gradient(180deg,#DCE9FB 0%,#E6EFF8 35%,#E3F1EF 65%,#ECE8F8 100%);
  --top:#DCE9FB; --navbg:rgba(255,255,255,.82); --navon:rgba(44,121,212,.15); --navink:#2C79D4;
  --g-blue:linear-gradient(135deg,rgba(65,137,222,.2),rgba(255,255,255,.7)); --g-green:linear-gradient(135deg,rgba(28,145,108,.18),rgba(255,255,255,.7)); --g-amber:linear-gradient(135deg,rgba(242,183,5,.22),rgba(255,255,255,.7));
  --shadow:0 10px 26px -16px rgba(16,35,68,.45); color-scheme:light}}
html{background:var(--bg) var(--page) fixed;min-height:100%}
body{background:transparent;padding-bottom:118px}
body::before{background:var(--top)}
.top{background:color-mix(in srgb,var(--top) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row,.stat,.setc,.tbl,.ex,.kv,.fcard,.opt,.btn,.iconbtn,select,input[type=search],textarea{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.row{border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.row .n{border-radius:12px;background:var(--t-blue);color:#fff}
.row.done .n{background:var(--t-green)}
.stat,.setc,.tbl{border-radius:18px}
.btn,.iconbtn{border-radius:14px}
.btn.pri,.cont{background:var(--t-blue);border-color:transparent;color:#fff}
.cont{border-radius:22px;box-shadow:0 14px 30px -14px rgba(44,121,212,.8)}
.iconbtn.on{background:var(--t-green);border-color:transparent;color:#fff}
.seg{border-radius:18px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(12px)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--t-blue);color:#fff;box-shadow:0 6px 16px -8px rgba(44,121,212,.9)}
.kv{background:var(--accent-soft);border:1px solid var(--line);border-radius:16px}
.ex{border-left-color:var(--accent);border-radius:0 16px 16px 0}
.spk{background:var(--t-amber);color:#2B2100}
.lesson h2{border-top-color:var(--accent)}.lesson h3{color:var(--de)}
.lesson li::before,.crow a{color:var(--de)}
.bar i{background:var(--t-blue)}
.fcard{border-radius:26px;box-shadow:var(--shadow)}.fcard.back{background:var(--g-green)}
.opt{border-radius:16px}
select,option,optgroup{background-color:#14233f;color:#EAF0FA}
:root[data-theme="light"] select,:root[data-theme="light"] option,:root[data-theme="light"] optgroup{background-color:#fff;color:#10213F}
nav.tabs{left:50%;right:auto;transform:translateX(-50%);width:min(94%,560px);bottom:calc(12px + env(safe-area-inset-bottom,0px));border:1px solid rgba(255,255,255,.16);border-radius:30px;background:var(--navbg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:6px;gap:2px;box-shadow:0 16px 36px -14px rgba(0,0,0,.7)}
nav.tabs button{border-radius:24px;min-height:52px;font-size:.68rem}
nav.tabs button[aria-current="true"]{background:var(--navon);color:var(--navink)}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
/* en-tête type « pilule » + tuiles */
.pill{display:flex;align-items:center;gap:10px;margin-top:10px;padding:7px 8px 7px 10px;border:1px solid var(--line);border-radius:26px;background:var(--surface);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.pill b{flex:1;text-align:center;font-family:var(--f-display);font-size:1.05rem}.pill .iconbtn{border:0;background:var(--surface2);min-width:40px;height:40px;border-radius:50%}
.pill img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.greet{margin:18px 2px 2px;font-family:var(--f-display);font-size:1.9rem;font-weight:700}.greet+p{margin:0 2px 6px;color:var(--muted)}
.tiles{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.tile{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.tile.b{background:var(--g-blue)}.tile.g{background:var(--g-green)}.tile.a{background:var(--g-amber);padding:12px 16px;border-radius:22px}
.tile i{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:1.6rem;color:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.tile.b i{background:var(--t-blue)}.tile.g i{background:var(--t-green)}.tile.a i{background:var(--t-amber);width:46px;height:46px;border-radius:13px}
.tile .t{flex:1;min-width:0}.tile b{display:block;font-family:var(--f-display);font-size:1.2rem}.tile small{color:var(--muted)}.tile .chev{font-size:1.4rem}
/* verbes */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;color:var(--muted);min-height:38px}
.chip[aria-pressed=true]{background:var(--t-blue);border-color:transparent;color:#fff}
.chips.lt .chip{padding:6px 11px;min-width:38px;text-align:center}
.vrow{box-shadow:none;padding:11px 14px}.vrow .t b{font-size:1.08rem}.vrow .forms{display:block;color:var(--muted);font-size:.82rem;margin-top:1px}.vfav{color:var(--mark);font-size:1.1rem}
.bdg{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin:0 4px 4px 0;background:var(--surface2);color:var(--ink)}
.bdg.fort{background:rgba(224,96,90,.25)}.bdg.faible{background:rgba(28,145,108,.28)}.bdg.mixte{background:rgba(242,183,5,.28)}.bdg.modal,.bdg.auxiliaire{background:rgba(139,124,240,.32)}.bdg.sein{background:rgba(65,137,222,.34)}
.vhero{padding:18px;border:1px solid var(--line);border-radius:26px;background:var(--g-blue);box-shadow:var(--shadow);margin:8px 0}
.vhero h1{font-size:2rem;color:var(--de);display:flex;align-items:center;gap:10px}.vhero .fr{font-size:1.05rem;color:var(--frc);margin:2px 0 10px}
.stam{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stam div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}.stam small{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}.stam b{font-family:var(--f-display);font-size:1.05rem;color:var(--de);overflow-wrap:anywhere}
.ctab td:first-child{color:var(--muted);width:34%;white-space:nowrap}.ctab td{cursor:pointer;font-size:1.02rem}.ctab td+td{font-weight:700;color:var(--de)}
.note{color:var(--muted);font-size:.9rem;margin:4px 2px 10px}
.vsearch{display:flex;gap:8px;margin:6px 0 4px}.vsearch input{flex:1}

details.gsec{border:1px solid var(--line);border-radius:20px;background:var(--surface);margin:10px 0;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
details.gsec summary{display:flex;align-items:center;gap:12px;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:1.08rem;cursor:pointer;list-style:none;min-height:56px}
details.gsec summary::-webkit-details-marker{display:none}details.gsec summary::after{content:"›";margin-left:auto;font-size:1.5rem;color:var(--muted);transition:transform .2s}
details.gsec[open] summary::after{transform:rotate(90deg)}details.gsec[open] summary{border-bottom:1px solid var(--line)}
.gn{flex:none;width:32px;height:32px;border-radius:10px;background:var(--t-blue);color:#fff;display:grid;place-items:center;font-size:.9rem}.gbody{padding:4px 14px 14px}.gbody h2{display:none}

<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
<div id="toastbox"></div>

<script>
(function(){
'use strict';
/* ---------- storage ---------- */
var KEY='de0b2:v1';
var S={done:{},cards:{},quiz:{},last:null,days:{},dir:'de',mode:'c',set:{}};
var DEF={name:'',theme:'dark',fs:100,lh:1.5,rate:.9,hide:false,newc:20,qn:10};
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); for(var k in o) S[k]=o[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function G(k){var v=S.set&&S.set[k];return v===undefined?DEF[k]:v;}
function applySettings(){
  var r=document.documentElement,t=G('theme');
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  r.style.setProperty('--root',G('fs')+'%');r.style.setProperty('--lh',G('lh'));
}
function today(){return new Date().toISOString().slice(0,10);}
function touchDay(){S.days[today()]=1;save();}
function streak(){var n=0,d=new Date();for(;;){var k=d.toISOString().slice(0,10);if(S.days[k]){n++;d.setDate(d.getDate()-1);}else if(n===0&&k===today()){d.setDate(d.getDate()-1);}else break;}return n;}

/* ---------- data ---------- */
var META=[],CATS={},LES={},LESMETA={},ORDER=[],ORD={c:[],d:[]};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fold(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json();});}
function loadMeta(){
  return getJSON('data/meta.json').then(function(m){
    META=m;
    m.forEach(function(c){c.lessons.forEach(function(l){l.cat=c.id;l.catname=c.name;l.k=c.k;LESMETA[l.id]=l;ORDER.push(l.id);ORD[c.k].push(l.id);});});
  });
}
var loading={};
function loadCat(id){
  if(CATS[id])return Promise.resolve();
  if(loading[id])return loading[id];
  loading[id]=getJSON('data/c'+(id<10?'0':'')+id+'.json').then(function(d){CATS[id]=1;for(var k in d)LES[k]=d[k];});
  return loading[id];
}
function loadAll(){return Promise.all(META.map(function(c){return loadCat(c.id);}));}

/* ---------- speech ---------- */
var voice=null;
function pickVoice(){try{var vs=speechSynthesis.getVoices();voice=vs.filter(function(v){return /^de/i.test(v.lang);})[0]||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(t){
  try{
    if(!('speechSynthesis' in window))throw 0;
    pickVoice();
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t).replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\//g,', '));
    u.lang='de-DE';u.rate=G('rate');if(voice)u.voice=voice;
    speechSynthesis.speak(u);
    if(!voice)toast('Aucune voix allemande détectée : installez-en une dans les réglages du téléphone.');
  }catch(e){toast('La lecture audio n’est pas disponible sur cet appareil.');}
}
var tt;function toast(m){var b=document.getElementById('toastbox');b.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(function(){b.innerHTML='';},3200);}

/* ---------- state / routing ---------- */
var V={name:'home'};
var nav=[];
function go(v,push){if(push!==false){V.sy=window.scrollY;nav.push(V);}V=v;render();window.scrollTo(0,0);}
function back(){var p=nav.pop();V=p||{name:'home'};render();var y=V.sy||0;window.scrollTo(0,y);setTimeout(function(){window.scrollTo(0,y)},60);}
function tab(n){nav=[];V={name:n};render();window.scrollTo(0,0);}

var ICONS={
  home:'<svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
  cards:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>',
  quiz:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .8-1 1.7M12 17h.01"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  prog:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
var TABS=[['home','Lire'],['cards','Cartes'],['quiz','Quiz'],['search','Recherche'],['prog','Progrès'],['set','Réglages']];
function section(){var n=V.name;return(n==='cat'||n==='lesson'||n==='verb'||n==='vguide'||n==='vprac')?'home':n;}
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(section()===t[0]?' aria-current="true"':'')+'>'+ICONS[t[0]]+'<span>'+t[1]+'</span></button>';}).join('');
}

/* ---------- helpers ---------- */
function doneCount(c){return c.lessons.filter(function(l){return S.done[l.id];}).length;}
function totalDone(){return Object.keys(S.done).length;}
function ckey(de){var h=5381;for(var i=0;i<de.length;i++)h=((h<<5)+h+de.charCodeAt(i))|0;return (h>>>0).toString(36);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var DEH={'allemand':1,'deutsch':1,'exemple allemand':1,'expression':1,'verbe':1,'mot':1,'phrase allemande':1,'vocabulaire':1,'infinitif':1};
function rich(t){return esc(t).replace(/\u27e6/g,'<span class="de2">').replace(/\u27e7/g,'</span>');}
function plain(t){return String(t).replace(/[\u27e6\u27e7]/g,'');}
function speakBtn(t){return '<button class="spk" data-speak="'+esc(t)+'" aria-label="Écouter">&#128266;</button>';}

/* ---------- views ---------- */
var app=document.getElementById('app');
function render(){
  if(typeof clearFind==='function'&&V.name!=='lesson'){var fb=document.getElementById('fbar');if(fb)fb.remove();}
  renderTabs();
  var f={verb:vVerb,vguide:vVGuide,vprac:vVPrac,home:vHome,cat:vCat,lesson:vLesson,cards:vCards,quiz:vQuiz,search:vSearch,prog:vProg,set:vSet}[V.name]||vHome;
  f();
}

function modeCats(k){return META.filter(function(c){return c.k===k;});}
function vHome(){
  if(S.mode==='v')return vVerbHome();
  var k=S.mode,lastL=S.last&&LESMETA[S.last];
  var ids=ORD[k],td=ids.filter(function(i){return S.done[i];}).length;
  var h=topPill()+'<div class="hero" style="display:flex;align-items:center;gap:14px"><div style="min-width:0"><div class="kicker">'+(k==='c'?'Cours complet · '+ORD.c.length+' fiches':'Dictionnaire thématique · '+ORD.d.length+' chapitres')+'</div><h1>'+(k==='c'?'Allemand <span>0 → B2</span>':'Dictionnaire <span>DE ↔ FR</span>')+'</h1></div></div>';
  h+=segHtml(k);
  var resume=(lastL&&lastL.k===k),showL=resume?lastL:LESMETA[ids[0]];
  h+='<button class="cont" data-lesson="'+showL.id+'"><div><small>'+(resume?(S.done[showL.id]?'Dernière leçon':'Reprendre'):'Commencer')+'</small><b>'+esc(showL.title)+'</b></div><span class="arrow">&rarr;</span></button>';
  h+='<div class="stats"><div class="stat"><b>'+td+'<small style="font-size:.9rem;color:var(--muted)"> / '+ids.length+'</small></b><span>'+(k==='c'?'leçons terminées':'chapitres lus')+'</span></div><div class="stat"><b>'+streak()+'</b><span>jours de suite</span></div><div class="stat"><b>'+learned()+'</b><span>cartes apprises</span></div></div>';
  if(k==='d')h+='<button class="row" data-tab="search" style="margin-bottom:6px"><span class="n">&#128269;</span><span class="t"><b>Chercher un mot</b><small>Allemand ou français, dans tout le dictionnaire</small></span><span class="chev">&rsaquo;</span></button>';
  h+='<div class="sec">Catégories</div><div class="list">';
  modeCats(k).forEach(function(c,ci){var d=doneCount(c),n=c.lessons.length;
    h+='<button class="row'+(d===n?' done':'')+'" data-cat="'+c.id+'"><span class="n">'+(d===n?'&#10003;':(k==='c'?c.id:ci+1))+'</span><span class="t"><b>'+esc(c.name)+'</b><small>'+d+' / '+n+(k==='c'?' leçons':' chapitres')+'</small><div class="bar"><i style="width:'+Math.round(d/n*100)+'%"></i></div></span><span class="chev">&rsaquo;</span></button>';});
  h+='</div><button class="row" data-tab="set" style="margin-top:14px"><span class="n">i</span><span class="t"><b>À propos et contact</b><small>Description de l’application, auteur, réglages</small></span><span class="chev">&rsaquo;</span></button>';
  app.innerHTML=h;
}
function learned(){var n=0;for(var k in S.cards)if(S.cards[k].b>=3)n++;return n;}

function vCat(){
  var c=META.filter(function(x){return x.id===V.id;})[0];
  var h='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(c.name)+'</h1></div><div class="list">';
  c.lessons.forEach(function(l,i){
    h+='<button class="row'+(S.done[l.id]?' done':'')+'" data-lesson="'+l.id+'"><span class="n">'+(S.done[l.id]?'&#10003;':(i+1))+'</span><span class="t"><b>'+esc(l.title)+'</b><small>'+(l.nc?l.nc+' cartes':'')+(l.nc&&l.nq?' · ':'')+(l.nq?l.nq+' questions':'')+(!l.nc&&!l.nq?(l.k==='d'?'Chapitre de lecture':'Fiche de lecture'):'')+'</small></span><span class="chev">&rsaquo;</span></button>';});
  app.innerHTML=h+'</div>';
}

function vLesson(){
  var m=LESMETA[V.id];
  app.innerHTML='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(m.catname)+'</h1></div><div class="spin">Chargement…</div>';
  loadCat(m.cat).then(function(){
    if(V.name!=='lesson'||V.id!==m.id)return;
    S.last=m.id;touchDay();
    var L=LES[m.id];
    var h='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>'+esc(m.catname)+'</h1><button class="iconbtn'+(S.done[m.id]?' on':'')+'" data-done="'+m.id+'" aria-label="Marquer comme terminée" aria-pressed="'+(!!S.done[m.id])+'">&#10003;</button></div>';
    h+='<article class="lesson"><div class="crumb">'+(m.k==='c'?'Fiche ':'Chapitre ')+(ORD[m.k].indexOf(m.id)+1)+' sur '+ORD[m.k].length+'</div><h1 class="ltitle">'+esc(m.title)+'</h1><div class="legend"><span class="de">Allemand</span><span class="frc">Français</span></div>';
    h+='<div class="actions">'+(L.c.length?'<button class="btn" data-lcards="'+m.id+'">Cartes ('+L.c.length+')</button>':'')+(L.q.length?'<button class="btn pri" data-lquiz="'+m.id+'">Quiz ('+L.q.length+')</button>':'')+'</div>';
    h+=blocks(L.b);
    var O=ORD[m.k],i=O.indexOf(m.id),pv=LESMETA[O[i-1]],nx=LESMETA[O[i+1]];
    h+='<div class="actions"><button class="btn wide'+(S.done[m.id]?' good':' pri')+'" data-done="'+m.id+'">'+(S.done[m.id]?'Leçon terminée ✓':'Marquer comme terminée')+'</button></div>';
    h+='<div class="pager">'+(pv?'<button class="btn" data-lesson="'+pv.id+'" data-replace="1"><small>&larr; Précédente</small>'+esc(pv.title)+'</button>':'')+(nx?'<button class="btn" data-lesson="'+nx.id+'" data-replace="1"><small>Suivante &rarr;</small>'+esc(nx.title)+'</button>':'')+'</div></article>';
    app.innerHTML=h;
    if(V.find)findInLesson(V.find);
  }).catch(function(){app.innerHTML+='<div class="empty">Impossible de charger la leçon. Vérifiez la connexion.</div>';});
}

function blocks(bs){
  var h='',inList=false;
  function closeList(){if(inList){h+='</ul>';inList=false;}}
  bs.forEach(function(b){
    if(b.t!=='li')closeList();
    switch(b.t){
      case 'h1':case 'h':h+='<h2>'+esc(b.x)+'</h2>';break;
      case 'h3':h+='<h3>'+esc(b.x)+'</h3>';break;
      case 'p':h+='<p>'+rich(b.x)+'</p>';break;
      case 'li':if(!inList){h+='<ul>';inList=true;}h+='<li'+(b.n?' class="num" data-n="'+esc(b.n)+'."':'')+'><span>'+rich(b.x)+'</span></li>';break;
      case 'kv':h+='<div class="kv"><b>'+esc(b.k)+'</b>'+rich(b.x)+'</div>';break;
      case 'ex':h+='<div class="ex'+(G('hide')?' hidefr':'')+'"><div class="tx"><span class="de">'+esc(b.de)+'</span>'+(b.fr?'<span class="fr">'+esc(b.fr)+'</span>':'')+'</div>'+speakBtn(b.de)+'</div>';break;
      case 'tbl':h+=tbl(b.rows);break;
    }
  });
  closeList();return h;
}
function colKind(c){var f=fold(c);
  if(/francais|traduction|sens|signification|bedeutung/.test(f)&&!/exemple allemand/.test(f))return 'fr';
  if(/allemand|deutsch|infinitif|exemple|expression|verbe|^mot|phrase|forme|nominativ|akkusativ|dativ|genitiv|substantif/.test(f))return 'de';
  return '';}
function tbl(rows){
  var head=rows[0],kind=head.map(colKind);
  var h='<div class="tbl"><table><thead><tr>'+head.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  rows.slice(1).forEach(function(r){h+='<tr>'+r.map(function(c,i){
    if(kind[i]==='de'&&c)return '<td class="de" data-speak="'+esc(c)+'">'+esc(c)+'</td>';
    if(kind[i]==='fr'&&c)return '<td class="frc">'+esc(c)+'</td>';
    return '<td>'+rich(c)+'</td>';}).join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

/* ---------- scope picker ---------- */
function scopeSel(cur,which){
  var o='<option value="all"'+(cur==='all'?' selected':'')+'>Tout (cours + dictionnaire)</option><option value="kc"'+(cur==='kc'?' selected':'')+'>Tout le cours</option><option value="kd"'+(cur==='kd'?' selected':'')+'>Tout le dictionnaire</option>';
  ['c','d'].forEach(function(k){o+='<optgroup label="'+(k==='c'?'Cours':'Dictionnaire')+'">';modeCats(k).forEach(function(c){o+='<option value="c'+c.id+'"'+(cur==='c'+c.id?' selected':'')+'>'+(k==='c'?c.id+'. ':'')+esc(c.name)+'</option>';});o+='</optgroup>';});
  if(cur&&LESMETA[cur]){var m=LESMETA[cur];o='<option value="'+cur+'" selected>Leçon : '+esc(m.title)+'</option>'+o;}
  return '<div class="scope"><select id="scopesel" data-scope="'+which+'" aria-label="Choisir le contenu">'+o+'</select></div>';
}
function poolFor(scope){
  var ids,need;
  if(scope==='all'||scope==='kc'||scope==='kd'){ids=scope==='all'?ORDER:scope==='kc'?ORD.c:ORD.d;
    need=scope==='all'?loadAll():Promise.all(modeCats(scope==='kc'?'c':'d').map(function(c){return loadCat(c.id);}));}
  else if(!LESMETA[scope]){var cid=+scope.slice(1);ids=META.filter(function(c){return c.id===cid;})[0].lessons.map(function(l){return l.id;});need=loadCat(cid);}
  else{ids=[scope];need=loadCat(LESMETA[scope].cat);}
  return need.then(function(){return ids.filter(function(i){return LES[i];}).map(function(i){return LES[i];});});
}

/* ---------- flashcards ---------- */
var FC={scope:'all',queue:[],i:0,flip:false,total:0,known:0};
var INT=[0,1,2,4,8,16,32];
function vCards(){
  if(!FC.started){
    app.innerHTML='<div class="top"><h1>Cartes de vocabulaire</h1><button class="iconbtn" data-dir aria-label="Sens des cartes">'+(S.dir==='de'?'DE→FR':'FR→DE')+'</button></div>'+scopeSel(FC.scope,'cards')+'<div class="spin">Préparation…</div>';
    poolFor(FC.scope).then(function(P){
      if(V.name!=='cards')return;
      var all=[];P.forEach(function(l){l.c.forEach(function(c){all.push(c);});});
      var now=Date.now(),due=[],fresh=[],n=0;
      all.forEach(function(c){var s=S.cards[ckey(c[0])];if(!s)fresh.push(c);else if(s.d<=now)due.push(c);});
      FC.avail={due:due.length,fresh:fresh.length,all:all.length};
      FC.queue=shuffle(due).concat(shuffle(fresh).slice(0,Math.max(0,G('newc')-due.length))).slice(0,G('newc'));
      FC.all=all;
      FC.i=0;FC.flip=false;FC.total=FC.queue.length;FC.known=0;
      drawCards(true);
    });
  }else drawCards(false);
}
function drawCards(intro){
  var head='<div class="top"><h1>Cartes de vocabulaire</h1><button class="iconbtn" data-dir aria-label="Sens des cartes">'+(S.dir==='de'?'DE→FR':'FR→DE')+'</button></div>'+scopeSel(FC.scope,'cards');
  if(!FC.all||!FC.all.length){app.innerHTML=head+'<div class="empty">Aucune carte dans ce choix.</div>';return;}
  if(!FC.queue.length||FC.i>=FC.queue.length){
    app.innerHTML=head+'<div class="score"><b>'+FC.known+' / '+FC.total+'</b>cartes sues pendant cette série</div><div class="actions"><button class="btn pri wide" data-cardsgo="1">Nouvelle série</button><button class="btn wide" data-cardsgo="force">Réviser quand même</button></div><div class="prog"><span>Cartes à revoir : '+(FC.avail?FC.avail.due:0)+'</span><span>Nouvelles : '+(FC.avail?FC.avail.fresh:0)+'</span></div>';
    FC.started=false;return;
  }
  FC.started=true;

var FND={els:[],i:0};
function clearFind(){var b=document.getElementById('fbar');if(b)b.remove();document.querySelectorAll('mark.fnd').forEach(function(m){var t=document.createTextNode(m.textContent);m.parentNode.replaceChild(t,m);});FND.els=[];}
function markIn(root,terms){
  var done=[];
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentNode.closest('button,script,style,mark.fnd')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  var nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(function(n){
    var txt=n.nodeValue,f=fold(txt),ranges=[];
    terms.forEach(function(t){var p=0,i;while((i=f.indexOf(t,p))>=0){ranges.push([i,i+t.length]);p=i+t.length;}});
    if(!ranges.length)return;
    ranges.sort(function(a,b){return a[0]-b[0];});
    var m=[ranges[0]];for(var k=1;k<ranges.length;k++){var l=m[m.length-1];if(ranges[k][0]<=l[1])l[1]=Math.max(l[1],ranges[k][1]);else m.push(ranges[k]);}
    var frag=document.createDocumentFragment(),pos=0;
    m.forEach(function(r){if(r[0]>pos)frag.appendChild(document.createTextNode(txt.slice(pos,r[0])));var mk=document.createElement('mark');mk.className='fnd';mk.textContent=txt.slice(r[0],r[1]);frag.appendChild(mk);done.push(mk);pos=r[1];});
    if(pos<txt.length)frag.appendChild(document.createTextNode(txt.slice(pos)));
    n.parentNode.replaceChild(frag,n);
  });
  return done;
}
function findInLesson(q){
  clearFind();
  var art=document.querySelector('article.lesson');if(!art||!q)return;
  var body=art.querySelectorAll('h2,h3,p,ul,.kv,.ex,table,.tblw');
  var f=fold(q).trim(),noart=f.replace(/^(der|die|das|ein|eine|to|se|sich) /,'');
  var tries=[[f],[noart],fold(q).split(/\s+/).filter(function(t){return t.length>2;})];
  var els=[];
  for(var a=0;a<tries.length&&!els.length;a++){if(!tries[a].length||(a===1&&noart===f))continue;
    // essaie d'abord avec tout le texte, sinon mot par mot
    els=markIn(art,tries[a]);
    if(els.length&&a===2){/* plusieurs mots : ok */}
  }
  var bar=document.createElement('div');bar.id='fbar';
  bar.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;max-width:704px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:.9rem';
  if(!els.length){
    bar.innerHTML='<span style="flex:1">« '+esc(q)+' » : pas retrouvé dans le texte de cette fiche (il peut se trouver dans les cartes).</span><button class="iconbtn" data-fclose aria-label="Fermer">&times;</button>';
    document.body.appendChild(bar);return;
  }
  FND.els=els;FND.i=0;
  bar.innerHTML='<span style="flex:1;min-width:0"><b id="fcnt"></b> · « '+esc(q)+' »</span><button class="iconbtn" data-fprev aria-label="Précédent">&uarr;</button><button class="iconbtn" data-fnext aria-label="Suivant">&darr;</button><button class="iconbtn" data-fclose aria-label="Fermer">&times;</button>';
  document.body.appendChild(bar);
  showFind(0);
}
function showFind(i){
  var n=FND.els.length;if(!n)return;FND.i=(i+n)%n;
  FND.els.forEach(function(m,k){m.classList.toggle('cur',k===FND.i);});
  var c=document.getElementById('fcnt');if(c)c.textContent=(FND.i+1)+' / '+n;
  var m=FND.els[FND.i];m.scrollIntoView({block:'center',behavior:'smooth'});
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-fclose],[data-fprev],[data-fnext]');if(!b)return;
  e.stopPropagation();
  if(b.hasAttribute('data-fclose'))return clearFind();
  showFind(FND.i+(b.hasAttribute('data-fnext')?1:-1));
},true);

var SIX=null,SQ='',DICT=null;
function buildIndex(){
  SIX=ORDER.map(function(id){
    var m=LESMETA[id],L=LES[id],t=[];
    L.b.forEach(function(b){
      if(b.t==='tbl')b.rows.forEach(function(r){t.push(plain(r.join(' · ')));});
      else if(b.t==='ex')t.push(b.de+' — '+b.fr);
      else if(b.t==='kv')t.push(b.k+' : '+plain(b.x));
      else t.push(plain(b.x));
    });
    return{id:id,title:m.title,ft:fold(m.title),lines:t,fl:t.map(fold)};
  });
}
function vSearch(){
  var h='<div class="top"><h1>Recherche</h1></div><div class="scope"><input type="search" id="q" placeholder="Mot, règle, titre…" value="'+esc(SQ)+'" autocomplete="off" aria-label="Rechercher dans tout le cours" style="flex:1"></div><div id="res"></div>';

  else doSearch();

function hl(s,toks){
  var out='',f=fold(s),mark=new Array(s.length).fill(false);
  toks.forEach(function(t){var p=0,i;while((i=f.indexOf(t,p))>=0){for(var k=i;k<i+t.length&&k<s.length;k++)mark[k]=true;p=i+t.length;}});
  var open=false;
  for(var k=0;k<s.length;k++){if(mark[k]&&!open){out+='<span class="hl">';open=true;}if(!mark[k]&&open){out+='</span>';open=false;}out+=esc(s[k]);}
  if(open)out+='</span>';return out;
}
function doSearch(){
  var res=document.getElementById('res');if(!res||!SIX)return;
  var toks=fold(SQ).split(/\s+/).filter(function(t){return t.length>0;});
  if(!toks.length){res.innerHTML='<div class="empty">Tapez un mot allemand ou français pour le retrouver dans le cours et le dictionnaire.</div>';return;}
  var wh=[];
  if(DICT){
    var q=toks.join(' ');
    DICT.forEach(function(w){var sc=-1;
      if(w.fd===q||w.fd.replace(/^(der|die|das) /,'')===q)sc=0;
      else if(w.ff===q)sc=1;
      else if(toks.every(function(t){return w.fd.indexOf(t)>=0;}))sc=2;
      else if(toks.every(function(t){return w.ff.indexOf(t)>=0;}))sc=3;
      if(sc>=0)wh.push({w:w,sc:sc});});
    wh.sort(function(a,b){return a.sc-b.sc||a.w.de.length-b.w.de.length;});
  }
  var hits=[];
  SIX.forEach(function(e){
    var tm=toks.every(function(t){return e.ft.indexOf(t)>=0;});
    var best=-1;
    for(var i=0;i<e.fl.length;i++){if(toks.every(function(t){return e.fl[i].indexOf(t)>=0;})){best=i;break;}}
    if(best<0&&!tm){var all=e.fl.join(' ');if(!toks.every(function(t){return all.indexOf(t)>=0;}))return;}
    hits.push({e:e,tm:tm,line:best});
  });
  hits.sort(function(a,b){return (b.tm-a.tm)||((b.line>=0)-(a.line>=0));});
  var h='';
  if(wh.length){h+='<div class="sec">Mots du dictionnaire · '+wh.length+(wh.length>25?' (25 premiers)':'')+'</div><div class="list">';
    wh.slice(0,25).forEach(function(x){h+='<div class="row"><span class="t" data-lesson="'+x.w.l+'" data-find="'+esc(x.w.de)+'" style="cursor:pointer"><b class="de">'+hl(x.w.de,toks)+'</b><div class="frc">'+hl(x.w.fr,toks)+'</div><button class="snip" style="background:none;border:0;padding:0;text-align:left;text-decoration:underline" data-lesson="'+x.w.l+'" data-find="'+esc(x.w.de)+'">📍 '+esc(LESMETA[x.w.l].title)+'</button></span><button class="spk" data-speak="'+esc(x.w.de)+'" aria-label="Écouter">&#128266;</button></div>';});
    h+='</div>';}
  h+='<div class="sec">Fiches · '+hits.length+' résultat'+(hits.length>1?'s':'')+(hits.length>40?' (40 premiers)':'')+'</div><div class="list">';
  hits.slice(0,40).forEach(function(x){
    var sn=x.line>=0?x.e.lines[x.line]:'';
    if(sn.length>150)sn=sn.slice(0,150)+'…';
    h+='<button class="row" data-lesson="'+x.e.id+'" data-find="'+esc(SQ.trim())+'"><span class="t"><b>'+hl(x.e.title,toks)+'</b>'+(sn?'<div class="snip">'+hl(sn,toks)+'</div>':'')+'<small>'+esc(LESMETA[x.e.id].catname)+'</small></span><span class="chev">&rsaquo;</span></button>';});
  res.innerHTML=h+'</div>';
}

function guideSecs(){
  var g={},cur=0;GUIDE.forEach(function(b){if(b.t==='h1'){cur=parseInt(b.x,10);g[cur]=[];}else if(cur)g[cur].push(b);});
  return [['Les six temps',GX.six.concat(g[1],g[6])],['Les terminaisons',g[2]],['Le prétérit',g[3]],['Le participe II',g[4]],['Haben ou sein ?',g[5]],['Les verbes séparables',g[7]],['Les verbes modaux',GX.mod],['Les verbes pronominaux',g[8]],['Sein, haben, werden',GX.shw],['Impératif, Konjunktiv II et astuces',g[9].concat(g[10])]];
}
function vVGuide(){
  var S10=guideSecs(),intro=GUIDE[0];
  var h='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>Technique de conjugaison</h1></div><article class="lesson"><div class="legend"><span class="de">Allemand</span><span class="frc">Français</span></div>'+blocks([intro])+'<div class="actions"><button class="btn" data-gall="1">Tout déplier</button><button class="btn" data-gall="0">Tout replier</button></div>';
  S10.forEach(function(x,i){h+='<details class="gsec"'+(i===0?' open':'')+'><summary><span class="gn">'+(i+1)+'</span>'+esc(x[0])+'</summary><div class="gbody">'+blocks(x[1])+'</div></details>';});
  app.innerHTML=h+'<div class="actions"><button class="btn pri wide" data-vprac>S’entraîner maintenant</button></div></article>';
}
function vVPrac(){
  loadVerbs().then(function(){
    if(V.name!=='vprac')return;
    var head='<div class="top"><button class="iconbtn" data-back aria-label="Retour">&larr;</button><h1>Entraînement verbes</h1></div>';
    if(!VP.qs){app.innerHTML=head+'<div class="score"><b>10</b>questions sur les formes des verbes</div><div class="actions"><button class="btn pri wide" data-vstart>Commencer</button></div><p class="note">Partizip II, Präteritum et auxiliaire (haben ou sein) des verbes à connaître.</p>';return;}
    if(VP.i>=VP.qs.length){var p=Math.round(VP.score/VP.qs.length*100);touchDay();app.innerHTML=head+'<div class="score"><b>'+VP.score+' / '+VP.qs.length+'</b>'+(p>=80?'Très bien !':p>=50?'Bien, continuez.':'À retravailler : relisez la fiche des verbes.')+'</div><div class="actions"><button class="btn pri wide" data-vstart>Rejouer</button></div>';return;}
    var q=VP.qs[VP.i];
    var h=head+'<div class="prog"><span>Question '+(VP.i+1)+' / '+VP.qs.length+'</span><span>Score '+VP.score+'</span></div><div class="q"><div class="qt">'+q.t+'</div><div class="qq de">'+esc(q.q)+'</div><div class="hint frc">'+esc(q.f)+'</div><div class="opts">';
    q.o.forEach(function(o,i){var cl='opt de';if(VP.ans>=0){if(i===q.a)cl+=' ok';else if(i===VP.ans)cl+=' ko';}h+='<button class="'+cl+'" data-vopt="'+i+'"'+(VP.ans>=0?' disabled':'')+'>'+esc(o)+'</button>';});
    h+='</div>';if(VP.ans>=0)h+='<button class="btn pri" style="width:100%" data-vnext>'+(VP.i+1<VP.qs.length?'Suivante':'Voir le résultat')+'</button>';
    app.innerHTML=h+'</div>';
  });
}
function vMakeQs(){
  var P=VB.filter(function(v){return v.top&&!v.s&&!v.r;});if(P.length<20)P=VB;
  return shuffle(P).slice(0,10).map(function(v){
    var ty=Math.floor(Math.random()*3),q,o,a,pick=function(fn,ok){var s={};s[ok]=1;var r=[ok];shuffle(VB).forEach(function(x){var y=fn(x);if(r.length<4&&y&&!s[y]&&!x.s&&!x.r){s[y]=1;r.push(y);}});return r;};
    if(ty===0){o=shuffle(pick(function(x){return x.p;},v.p));q={t:'Quel est le Partizip II ?',q:v.i,f:v.f,o:o,a:o.indexOf(v.p)};}
    else if(ty===1){o=shuffle(pick(function(x){return x.t;},v.t));q={t:'Quel est le Präteritum (er/sie/es) ?',q:v.i,f:v.f,o:o,a:o.indexOf(v.t)};}
    else{o=['haben','sein'];q={t:'Quel auxiliaire au Perfekt ?',q:v.i,f:v.f,o:o,a:o.indexOf(v.a)};}
    return q;});
}
/* événements de la rubrique */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-themetoggle],[data-verb],[data-vf],[data-vl],[data-vmore],[data-vguide],[data-vprac],[data-vfav],[data-vt],[data-vstart],[data-vopt],[data-vnext],[data-gall]');
  if(!t)return;var d=t.dataset;
  if('themetoggle' in d){var dark=document.documentElement.getAttribute('data-theme')!=='light'&&!(G('theme')==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);S.set.theme=dark?'light':'dark';save();applySettings();return;}
  if(d.verb){if(d.vrep){nav.pop();return go({name:'verb',id:d.verb,vt:V.vt},true);}return go({name:'verb',id:d.verb});}
  if(d.vf){VF.f=d.vf;VF.n=80;[].forEach.call(document.querySelectorAll('#vchips .chip'),function(b){b.setAttribute('aria-pressed',b.dataset.vf===VF.f);});return drawVList();}
  if(d.vl!==undefined){VF.letter=d.vl;VF.n=80;[].forEach.call(document.querySelectorAll('#vlt .chip'),function(b){b.setAttribute('aria-pressed',b.dataset.vl===VF.letter);});return drawVList();}
  if('vmore' in d){VF.n+=120;return drawVList();}
  if('vguide' in d)return go({name:'vguide'});
  if('vprac' in d){VP={};return go({name:'vprac'});}
  if(d.vfav){var F=favs();if(F[d.vfav])delete F[d.vfav];else{F[d.vfav]=1;toast('Ajouté aux favoris');}save();return vVerb();}
  if(d.vt){V.vt=d.vt;return vVerb();}
  if(d.gall!==undefined){[].forEach.call(document.querySelectorAll('details.gsec'),function(x){x.open=d.gall==='1';});return;}
  if('vstart' in d){VP={qs:vMakeQs(),i:0,score:0,ans:-1};return vVPrac();}
  if(d.vopt!==undefined&&VP.ans<0){VP.ans=+d.vopt;if(VP.ans===VP.qs[VP.i].a)VP.score++;return vVPrac();}
  if('vnext' in d){VP.i++;VP.ans=-1;return vVPrac();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='vq'){VF.q=e.target.value;VF.n=80;drawVList();}
  if(e.target.id==='nm'){S.set.name=e.target.value.trim();save();}
});
